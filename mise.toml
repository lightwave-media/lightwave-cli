# mise tool version pins — see https://mise.jdx.dev
#
# One source of truth for Go, Node, Python/pre-commit, and Go-tool versions
# across local dev + CI. `mise install` in this dir resolves everything.
# CI invokes the same pins via `jdx/mise-action@v4` so CI and local cannot drift.
#
# Why pinned (vs `latest`):
#   - Reproducibility — a new lint rule shouldn't break CI silently
#   - golangci-lint v2 ↔ config schema coupling — the v2.5.0 config in
#     `.golangci.yml` won't parse under v3 if/when it lands
#   - goreleaser config schema versions matter for the release pipeline

[tools]
go = "1.26.7"
node = "24"
python = "3.12"
"pipx:pre-commit" = "4.2.0"
# Pin via ubi: backend (direct from GitHub releases) — the default
# aqua: backend has had intermittent 400s on the registry endpoint.
"ubi:golangci/golangci-lint" = "v2.13.2"
"ubi:goreleaser/goreleaser" = "v2.15.4"
"ubi:jstemmer/go-junit-report" = "v2.1.0"

# --- Local CI tasks -------------------------------------------------------
# `mise run ci` mirrors the pre-push gate (.pre-commit-config.yaml) + Makefile
# so the same checks run locally. Tools resolve to the pins above. Personal
# local layer; the pre-commit framework + GH workflows are unchanged.
[tasks.pre-commit]
description = "Run pre-commit on all files (matches CI pre-commit job)"
run = "pre-commit run --all-files --show-diff-on-failure"

[tasks.fmt-check]
description = "gofmt check"
run = 'test -z "$(gofmt -l .)"'

[tasks.vet]
description = "go vet"
run = "go vet ./..."

[tasks.lint]
description = "golangci-lint (ratcheted to new code vs origin/main — matches the baseline)"
# Strip inherited git location vars (see [tasks.test]). --new-from-merge-base
# shells out to git to compute the diff; under the pre-push gate an inherited
# GIT_DIR points that at the wrong repo, yielding a garbage diff and spurious
# "new" findings. Unset so the ratchet compares against the real worktree.
run = "unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_COMMON_DIR GIT_PREFIX GIT_CONFIG_PARAMETERS; golangci-lint run --new-from-merge-base=origin/main --timeout=10m ./..."

[tasks.build]
description = "Build lw"
run = "go build ./cmd/lw"

# Installing lw is `mise run lw:sync` (fleet-level ~/dev/mise.toml) — one
# installer, reachable from every repo, already depended on by lw:sync:home and
# release:gate. `patch` below is the sandboxed variant for iterating on THIS
# worktree without touching what other sessions run. Do not add a third.
[tasks.codespell]
description = "Spell-check (matches the CI Codespell job; reads .codespellrc)"
# CI runs this as a SEPARATE GitHub job (.github/workflows/codespell.yml), not
# via pre-commit — so without this task it never ran locally and a misspelling
# only surfaced in cloud CI. codespell auto-reads .codespellrc in cwd.
run = "codespell"

[tasks.tidy]
description = "Verify go mod tidy is a no-op (matches the CI Tidy Check job)"
# Mirrors .github/workflows/go-mod-tidy-check.yml: fail if go mod tidy would
# change go.mod/go.sum. Restore on completion so the check is non-mutating.
run = '''
cp go.mod go.mod.cibak && cp go.sum go.sum.cibak
go mod tidy
status=0
diff -q go.mod go.mod.cibak >/dev/null || { echo "go.mod not tidy — run 'go mod tidy' and commit"; status=1; }
diff -q go.sum go.sum.cibak >/dev/null || { echo "go.sum not tidy — run 'go mod tidy' and commit"; status=1; }
mv go.mod.cibak go.mod && mv go.sum.cibak go.sum
exit $status
'''

[tasks.test]
description = "go test (race + shuffle, matches CI)"
# Strip inherited git location vars before testing. When this task runs from the
# pre-push gate, git exports GIT_DIR/GIT_WORK_TREE/etc. pointing at the real
# repo; tests that shell out to `git` in temp dirs (internal/git,
# internal/docsfactory, …) would otherwise target — and corrupt — the canonical
# checkout. This blanket guard covers raw-exec test helpers that don't go
# through the internal/git wrapper. Same pattern as scripts/precommit/hooks_test.sh.
run = "unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_COMMON_DIR GIT_PREFIX GIT_CONFIG_PARAMETERS; go test -race -shuffle=on ./..."

[tasks.mutation]
description = "Changed-code mutation evidence (observe/warn/block ratchet)"
run = "bash dev/mutation_gate.sh"

[tasks."mutation:block"]
description = "Enforce changed-code mutation thresholds after ratchet promotion"
run = "LW_MUTATION_ENFORCEMENT=block bash dev/mutation_gate.sh"

[tasks."schema-drift"]
description = "Schema↔handler drift + command-surface trust (matches the CI Schema Drift job)"
# Mirrors .github/workflows/schema-drift-check.yml. Third cloud-only gate pulled
# local, after codespell and tidy (#231), for the same reason and with a sharper
# case: the drift gate is ARMED and blocks the merge (#301), yet `mise run ci`
# never ran it. A local-green push could therefore fail the required gate on a
# change the developer had no local way to see.
#
# That is not hypothetical. On 2026-09-12 lightwave-core#615 declared `check
# stamp`; this repo's handler landed separately in #393. In the window between,
# `mise run ci` was green and the cloud Schema Drift job failed with
# "1 missing (check.stamp)".
#
# CAVEAT, deliberately not hidden: CI checks out lightwave-core fresh at its
# main, while this reads whatever ~/dev/lightwave-core currently has out. A
# sibling session holding that repo on a feature branch makes local and cloud
# disagree, so a local pass is only as current as that checkout. Verify a
# surprising result against a ref (`git -C ~/dev/lightwave-core show
# origin/main:src/schemas/interfaces/cli/commands.yaml`) before trusting it.
#
# LW_STAMP_ROOT is the escape hatch for exactly that case — point it at a
# checkout that matches core's main:
#
#   LW_STAMP_ROOT=/path/to/root mise run schema-drift    # expects <root>/lightwave-core
#
# It exists because LW_LIGHTWAVE_ROOT, which this task originally told you to
# set, CANNOT be overridden here. ~/dev/mise.toml declares
# `LW_LIGHTWAVE_ROOT = "{{ env.HOME }}/dev"` under [env], and a mise [env] entry
# overrides the value the caller exported — so every repo under ~/dev sees
# ~/dev no matter what was passed in. Verified by passing a sentinel:
# `LW_LIGHTWAVE_ROOT=/tmp/PROBE mise run <task>` printed /Users/joelschaeffer/dev.
# The documented workaround was itself unreachable, which is the same defect
# class as #351's --skip-paperclip.
run = '''
root="${LW_STAMP_ROOT:-${LW_LIGHTWAVE_ROOT:-$HOME/dev}}"
stamp="$root/lightwave-core/src/schemas/interfaces/cli/commands.yaml"

# Assert the precondition instead of letting the fallback answer for us. With no
# core checkout `lw` silently measures against the embedded stamp snapshot, which
# lags core (#376) — on 2026-09-12 that produced "orphaned handlers (1)
# check.stamp" against a tree where check.stamp is correctly registered. Failing
# with a phantom orphan sends the reader chasing a bug that does not exist, so
# say what is actually wrong.
if [ ! -f "$stamp" ]; then
  echo "schema-drift: no lightwave-core stamp at $stamp"
  echo "  This gate compares the CLI against core's commands.yaml and cannot run"
  echo "  without it. The workspace contract is the flat ~/dev sibling layout;"
  echo "  clone lightwave-core beside this repo, or set LW_STAMP_ROOT."
  echo "  Not skipping: the cloud Schema Drift job is armed and blocks the merge."
  exit 1
fi

# Pass the resolved root down explicitly. The child would otherwise inherit
# mise's pinned LW_LIGHTWAVE_ROOT and measure a different tree than the one
# this task just asserted exists — the gate would report on a stamp nobody
# chose.
go build -o ./bin/lw ./cmd/lw || exit 1
LW_LIGHTWAVE_ROOT="$root" LW_SURFACE_GATE_STRICT=1 go test ./internal/cli/ -run TestCommandSurface || exit 1
LW_LIGHTWAVE_ROOT="$root" LW_CHECK_SCHEMA_STRICT=1 ./bin/lw check schema || exit 1
'''

[tasks.ci]
description = "Local CI: fmt-check + vet + lint + build + test + codespell + tidy + schema-drift"
# Mirrors the cloud CI required-gate job set so a local-green push is cloud-green.
# codespell + tidy were cloud-only jobs (separate GH workflows) absent here — a
# misspelling or untidy go.mod could only fail in cloud CI (lightwave-cli#231).
# schema-drift was the same gap and the costliest, because that gate blocks the
# merge: see the task's own comment for the 2026-09-12 case it would have caught.
#
# The one required-gate job still absent locally is Pre-commit. It is partly
# covered by the repo-tracked hooks that run on every commit, and `lw check
# pre-commit` (#381) is the verb that would close it properly.
depends = ["fmt-check", "vet", "lint", "build", "test", "codespell", "tidy", "schema-drift", "actions-pinned", "failure-digest"]

[tasks.actions-pinned]
description = "Every third-party GitHub Action is pinned to a commit SHA, not a mutable tag or branch"
# Runs its own proof first: a gate with no evidence it can fire is unverified,
# whatever its history says. The test asserts BOTH directions — a matcher
# loosened until it stops false-positiving can just as easily stop firing.
run = [
    "bash scripts/check-actions-pinned-test.sh",
    "bash scripts/check-actions-pinned.sh",
]

[tasks.failure-digest]
description = "The CI failure digest names the failing test and the shuffle seed (#345)"
# The digest itself only runs on a red CI run, which is rare by design — so its
# proof runs on every GREEN one instead. Otherwise it would sit unexercised for
# months and be found broken at the one moment it was needed, which is the shape
# of #345 itself. Writing the proof caught exactly that: the first version used
# only trailing context, so it named the failing test and dropped the assertion.
run = "bash scripts/failure-digest-test.sh"

[tasks."release:gate"]
description = "Dry-run lw release merge (autonomous gate)"
run = "go build -o ./bin/lw ./cmd/lw && ./bin/lw release merge lightwave-cli"

[tasks."release:qa"]
description = "Run QA release pass matrix (local)"
run = "go build -o ./bin/lw ./cmd/lw && bash dev/release_qa_pass.sh \"${LW_QA_ARTEFACT_DIR:-/tmp/qa-release-pass}\""

[tasks."release:flags"]
description = "List feature flags"
run = "go build -o ./bin/lw ./cmd/lw && ./bin/lw release flag --list"

[tasks."release:prepare"]
description = "Commit (hook-safe), rebase main, ci, release:qa"
run = "bash dev/release_prepare.sh --yes"

[tasks."release:ship"]
description = "Push branch and open/update PR"
run = "LW_RELEASE_SUPERSEDES=170 bash dev/release_ship.sh --yes"

[tasks."release:deliver"]
description = "Full delivery: prepare then ship (one command)"
depends = ["release:prepare", "release:ship"]
