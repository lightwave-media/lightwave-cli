version: 2

builds:
  - main: ./cmd/lw
    binary: lw
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lightwave-media/lightwave-cli/internal/version.Version={{.Version}}
      - -X github.com/lightwave-media/lightwave-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/lightwave-media/lightwave-cli/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # Auto-generate from conventional commits; CHANGELOG.md is the
  # human-curated complement that the release body links to.
  sort: asc
  filters:
    exclude:
      - "^wip:"
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\):"

release:
  # release-core (the release plane) creates the GitHub Release with git-cliff
  # notes; GoReleaser only uploads build artifacts to it. keep-existing =>
  # GoReleaser won't recreate or overwrite the plane's release body.
  mode: keep-existing
  # GitHub release body header — applies only when GoReleaser itself creates the
  # release (e.g. a manual `goreleaser release` run), not the plane path.
  header: |
    See the [Releases page](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases)
    for the canonical release notes. The commit log below is
    auto-generated from conventional commits.

# NO `brews:` BLOCK — the Homebrew tap is gone (lightwave-media/homebrew-tap was
# deleted 2026-09-16) and this block would fail every release trying to push a
# formula to a repo that 404s.
#
# Distribution is unchanged for everyone else: `builds` + `archives` + `release`
# above still publish signed cross-platform tarballs to the GitHub Releases page,
# which is where a tap formula pointed anyway.
#
# For this machine — where `lw` IS the shell's command spine — install from
# source instead of round-tripping a binary through tag → CI → GoReleaser → tap
# → `brew upgrade`:
#
#     mise run lw:sync      # ~3s: go build + install to ~/.local/bin
#
# If a tap is ever wanted back, recreate lightwave-media/homebrew-tap and restore
# this block; GoReleaser repopulates the formula on the next tag. The plane-side
# TAP_APP_* token minting in pipelines-workflows is now unused and can be dropped
# there separately.
