_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/workflows/scheduled_jobs/ci_feedback_loop"
  title: "CI Feedback Loop — autonomous fix-dispatch heartbeat"
  description: |
    Runs dev/ci-signal.sh on a schedule to detect CI failures, emit structured
    events to nullwatch, and dispatch v_core-package-developer via nullhub to
    autonomously fix failures and commit. Forms the autonomous loop in the
    agile pipeline: CI failure → agent fix → commit → CI pass → ticket close.

    Owner persona: v_core-package-developer (daemon-class).
    Event contract: lightwave://schemas/interfaces/hooks/ci_gate_event
    Observability: nullwatch port 7710 (spans via /v1/spans OTLP ingest)
    Dry-run: LW_CI_SIGNAL_DRY_RUN=1 dev/ci-signal.sh

id: ci_feedback_loop
title: "Lightwave Core CI feedback loop"
job_class: maintenance
schedule: "*/15 * * * *"
handler:
  transport: shell
  command: "dev/ci-signal.sh"
persona: v_core-package-developer
invariants:
  - no_recursive_strategic_delegation
  - tool_group_compliance
  - dry_run_safe

required_fields:
  - name: id
    type: str
    description: "Stable job identifier slug."
  - name: title
    type: str
    description: "Human-readable title for the job."
  - name: job_class
    type: str
    description: "Job class slug (e.g. maintenance, strategic). Determines concurrency cap and wall-clock budget."
  - name: schedule
    type: str
    description: "Cron expression (standard 5-field) defining the heartbeat cadence."
  - name: handler
    type: object
    description: "Execution target. Sub-fields: transport (enum: shell | cli | http), command (str)."
  - name: persona
    type: str
    description: "Agent persona role that owns and is dispatched for this job."

optional_fields:
  - name: budget_ref
    type: str
    description: "Reference into heartbeat_budget for per-run cost cap."
  - name: invariants
    type: "list[string]"
    description: "Enforced behavioral invariants for the dispatched persona session."

example:
  id: ci_feedback_loop
  title: "Lightwave Core CI feedback loop"
  job_class: maintenance
  schedule: "*/15 * * * *"
  handler:
    transport: shell
    command: "dev/ci-signal.sh"
  persona: v_core-package-developer
  invariants:
    - no_recursive_strategic_delegation
    - tool_group_compliance
    - dry_run_safe
