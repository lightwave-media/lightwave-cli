  # from this host (lightwave-core#696). Category and agents are taken from
  # each SKILL.md's own frontmatter, not chosen here.
  alignment-audit:
    slug: alignment-audit
    category: governance
    print_path: ~/.lightwave/skills/alignment-audit/SKILL.md
    description: Truth alignment audit across the SST index, plan files and
      cross-repo working trees — stale schema refs, untracked YAML, index
      drift, plan lifecycle.
    agents:
    - v_staff-engineer
