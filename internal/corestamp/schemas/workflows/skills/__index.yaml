  # Five more prints landed on the host mid-registration (identical mtime —
  # one batch copy). Keyed by frontmatter `name`, which is what the census
  # test compares. The create-skill/ print is Anthropic's skill-creator, but
  # its frontmatter names it create-skill and that is the key the test wants.
  ci-feedback-loop:
    slug: ci-feedback-loop
    category: tooling
    print_path: ~/.lightwave/skills/ci-feedback-loop/SKILL.md
    description: Design, build and wire the CI feedback loop — mise run ci
