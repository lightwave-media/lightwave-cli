_meta:
  version: "1.1.0"
  schema_id: "lightwave://schemas/workflows/sops/agile_orchestration"
  title: "Agile Orchestration — Sprint Cycle State Machine"
  description: |
    Orchestrates the full agile development pipeline: backlog grooming →
    sprint planning → execution (with developer sandboxing) → review
    (Q-suite gates) → retrospective. This is the orchestration layer that
    sits above the R-P-I-V-R artifact schemas and below the software
    lifecycle phase state machine.

    The orchestrator (v_scrum-manager) manages sprint cycles. Developers
    are dispatched tasks from the sprint backlog. Q-suite personas are
    activated at phase boundaries. Every state transition is recorded in
    runbook_executions for audit.

    Flow (from user's sprint cycle diagram):
      Start → Orchestrator → ProductOwner → EngTeam → DevPersona → Repo → CI
      → CodeReview → MergeReady → Deployment → Retrospective → NextSprint

  generates:
    - "go:AgileOrchestration"
  depends_on:
    - "lightwave://schemas/workflows/sops/software_lifecycle"
    - "lightwave://schemas/data/agile_artifacts/sprint"
    - "lightwave://schemas/data/agile_artifacts/task"
    - "lightwave://schemas/policy/governance/developer_sandbox"
    - "lightwave://schemas/data/enums/model_tiers"
    - "lightwave://schemas/workflows/strategies/model_selection"

# ── Intelligence placement (added v1.1.0) ─────────────────────────────────────
#
# Each phase carries an `intelligence:` block naming TIERS from
# data/enums/model_tiers.yaml — never model ids. Model ids are runtime data
# with a short half-life; 33 persona files each hardcoding one is exactly why
# they all went stale together (28 still name `claude-sonnet-4-6`, which is not
# a valid model). Tier -> model resolution belongs to the catalog at
# integrations/llm_providers/models/ and the matcher that reads it.
#
# The rule these assignments follow:
#
#   Place intelligence by irreversibility x volume — never by prestige.
#     frontier  high irreversibility, low volume  (release sign-off, sprint
#               goal, architecture, doctrine)
#     powerful  bounded blast radius, medium volume (refactors, code review,
#               test-efficacy judgement)
#     standard  recoverable, routine (single-file edits, bug fixes,
#               estimation, synthesis)
#     local     high volume, cheap to be wrong, $0 (first-pass review,
#               dedupe, extraction, boilerplate)
#     none      NO JUDGEMENT INVOLVED — arithmetic, exit codes, thresholds.
#
# `none` is the tier most likely to be skipped and it matters most: a gate
# that calls a model is both more expensive and less deterministic than one
# that computes. ci_green is an exit code. v_cfo_token_budget is arithmetic
# over cost_record.jsonl. Neither should ever reach an LLM.
#
# These assignments are a reasoned starting hypothesis, NOT a measurement.
# They should be corrected once cost_record.jsonl actually carries
# intelligence_tier_used / intelligence_tier_required — which as of
# 2026-09-13 it does not, on any of 301 records.

required_fields:
  - name: sprint_slug
    type: str
    description: "Active sprint identifier"
  - name: orchestration_phase
    type: str
    description: "Current orchestration phase"
  - name: orchestrator
    type: str
    description: "Agent persona managing this sprint (v_scrum-manager)"

optional_fields:
  - name: active_developers
    type: "list[str]"
    description: "Developer instances active in this sprint"
  - name: review_queue
    type: "list[str]"
    description: "Q-suite personas queued for review"

# ── Orchestration Phases ──────────────────────────────────────────────────────

phases:
  backlog_grooming:
    order: 0
    lifecycle_phase: planning
    description: |
      Product ideas and requests enter the backlog. v_product-manager and
      v_scrum-manager groom the backlog: Can we do it? Is it worth it?
      Items move through Open → Considering → Scoping → Prioritized.
    allowed_transitions:
      - sprint_planning
    outputs:
      - prioritized_backlog
    personas:
      - v_product-manager
      - v_scrum-manager
    # Grooming is high-volume and cheap to get wrong — a bad call is reversed
    # at the next grooming. Dedupe/classify/extract carry no judgement worth
    # paying for; only the feasibility and worth-it calls do.
    intelligence:
      default_tier: local
      policy: local_first
      tasks:
        dedupe_and_classify: local
        extract_acceptance_criteria: local
        feasibility_assessment: standard
        worth_it_prioritisation: standard
        epic_level_scoping: powerful

  sprint_planning:
    order: 1
    lifecycle_phase: planning
    description: |
      Prioritized items are assigned to a sprint. v_cfo reviews token
      budget. Tasks are estimated. Developer instances are assigned.
      Sprint goals are set.
    allowed_transitions:
      - sprint_execution
      - backlog_grooming
    gates:
      - v_cfo_token_budget
    outputs:
      - sprint_plan
      - task_assignments
      - token_budget
    personas:
      - v_scrum-manager
      - v_product-manager
      - v_cfo
    # The sprint goal commits the whole team for the sprint and is expensive
    # to reverse — that is what frontier is for. The v_cfo token-budget gate
    # is arithmetic over cost_record.jsonl: running a model on it would cost
    # tokens AND make a gate nondeterministic.
    intelligence:
      default_tier: standard
      policy: cheapest_adequate
      tasks:
        token_budget_gate: none
        capacity_arithmetic: none
        estimation: standard
        task_assignment: standard
        sprint_goal_commitment: frontier
      gate_tiers:
        v_cfo_token_budget: none

  sprint_execution:
    order: 2
    lifecycle_phase: execution
    description: |
      Developers work on assigned tasks within their sandboxed repos.
      CI runs every 15 minutes. Tasks move through In Design → In Dev →
      In Review → Ready for Deployment. v_staff-engineer ponytail audits
      CI-green changes. Bugs are triaged through the bug process.
    allowed_transitions:
      - sprint_review
      - sprint_execution
    gates:
      - ci_green
      - code_review
    personas:
      - v_core-package-developer
      - v_cli-developer
      - v_frontend-developer
      - v_platform-developer
      - v_sys-developer
      - v_infra-developer
      - v_staff-engineer
    cron_schedule: "*/15 * * * *"
    # THE VOLUME CENTRE. Measured 2026-09-13: claude-opus-5 carried 99.0% of
    # all notional spend ($56,912 of $57,498) because nothing routed anything
    # — not because the work needed frontier. Ponytail's first pass runs
    # local (measured 11.82 tok/s, $0, and it caught a bare except, a
    # hardcoded sk-live- token and an unused parameter on a fixture);
    # escalate to powerful only once that pass reports blockers.
    # NOTE: the local reviewer's context ceiling is 32k — escalate diffs
    # larger than that instead of truncating them.
    intelligence:
      default_tier: standard
      policy: cheapest_adequate
      tasks:
        boilerplate_scaffold: local
        single_file_edit: standard
        bug_fix: standard
        multi_file_refactor: powerful
        architecture_decision: frontier      # escalation only
        ponytail_audit_first_pass: local
        ponytail_audit_on_blockers: powerful
        mechanical_test_presence_check: economic
      gate_tiers:
        ci_green: none                        # exit code
        code_review: none                     # threshold on the review verdict
      escalation:
        policy: local_with_failover
        from: local
        to: powerful
        triggers:
          - local_reports_blockers
          - diff_exceeds_local_context_window
          - local_unavailable_or_degraded

  sprint_review:
    order: 3
    lifecycle_phase: review
    description: |
      All sprint tasks are complete. Q-suite review gate: v_staff-engineer
      runs ponytail audit, v_qa-engineer verifies tests, v_cto signs off
      on release-train compliance. Release notes are generated.
    allowed_transitions:
      - sprint_retrospective
      - sprint_execution
    gates:
      - v_staff-engineer_ponytail
      - v_qa-engineer_verify
      - v_cto_signoff
    personas:
      - v_staff-engineer
      - v_qa-engineer
      - v_cto
    # v_cto_signoff releases to main and deploys. It is the most irreversible
    # act in the cycle and the lowest-volume — one per sprint. This is the
    # place frontier plainly earns its cost, and the reason the rest of the
    # cycle can afford not to use it.
    intelligence:
      default_tier: powerful
      policy: cheapest_adequate
      tasks:
        coverage_sweep: local
        test_efficacy_judgement: powerful
        ponytail_second_pass: powerful
        release_notes_generation: standard
        release_signoff: frontier
      gate_tiers:
        v_staff-engineer_ponytail: powerful
        v_qa-engineer_verify: powerful
        v_cto_signoff: frontier

  sprint_retrospective:
    order: 4
    lifecycle_phase: maintenance
    description: |
      Sprint review and retrospective. Capture insights, improvements,
      quality scores. Feed back into next sprint planning. Continuous
      improvement loop.
    allowed_transitions:
      - backlog_grooming
    outputs:
      - retrospective_notes
      - quality_score
      - improvements
    personas:
      - v_scrum-manager
      - v_product-manager
    # Quality scores and sprint metrics are arithmetic. Only the synthesis
    # is judgement, and a retro insight is revisited next sprint — amending
    # standing doctrine is the one irreversible act here.
    intelligence:
      default_tier: standard
      policy: cheapest_adequate
      tasks:
        metric_aggregation: none
        insight_synthesis: standard
        doctrine_amendment: frontier

# ── Task State Machine (within Sprint Execution) ──────────────────────────────

task_workflow:
  description: |
    Within sprint execution, individual tasks follow their own state machine.
    This is the R-P-I-V-R lifecycle at the task level.

  states:
    - name: open
      description: "Task is in the backlog, not yet assigned to a sprint"
    - name: prioritized
      description: "Task is in the sprint backlog, ready for dispatch"
    - name: in_design
      description: "Developer is designing the solution"
    - name: in_development
      description: "Developer is implementing"
    - name: in_review
      description: "Code is under review by v_staff-engineer (ponytail audit)"
    - name: ready_for_deployment
      description: "All gates passed, ready to merge"
    - name: done
      description: "Merged and deployed"

  transitions:
    - from: open
      to: prioritized
      trigger: v_scrum-manager
      condition: "task added to sprint backlog"

    - from: prioritized
      to: in_design
      trigger: automatic
      condition: "developer instance dispatched"

    - from: in_design
      to: in_development
      trigger: developer
      condition: "design approved, boilerplate scaffolded"

    - from: in_development
      to: in_review
      trigger: developer
      condition: "CI green, code committed"

    - from: in_review
      to: in_development
      trigger: v_staff-engineer
      condition: "ponytail audit found issues"

    - from: in_review
      to: ready_for_deployment
      trigger: v_staff-engineer
      condition: "ponytail audit passed"

    - from: ready_for_deployment
      to: done
      trigger: v_cto
      condition: "release-train sign-off"

# ── Bug Triage Sub-Process ────────────────────────────────────────────────────

bug_process:
  description: |
    Defects follow a separate triage flow within sprint execution.
    Bugs are created as Forgejo discussions first, promoted to issues
    after triage confirms reproducibility.

  states:
    - name: defect_detected
      description: "CI failure or user report"
    - name: bug_submitted
      description: "Forgejo discussion created"
    - name: triage
      description: "Can we reproduce? Need more info?"
    - name: awaiting_fix
      description: "Prioritized in backlog"
    - name: not_a_bug
      description: "Closed — not reproducible or by design"
    - name: fixed
      description: "Fix merged, verified"

  discussion_first_policy:
    description: |
      Every bug starts as a Forgejo discussion. Only after triage confirms
      it's reproducible does it get promoted to an issue. This prevents
      issue spam and ensures discussion context is captured before code
      changes begin.

# ── Example ───────────────────────────────────────────────────────────────────

example:
  sprint_slug: "v_core-v1-ready-task-dispatch"
  orchestration_phase: sprint_execution
  orchestrator: v_scrum-manager
  active_developers:
    - v_core-package-developer
  review_queue: []
