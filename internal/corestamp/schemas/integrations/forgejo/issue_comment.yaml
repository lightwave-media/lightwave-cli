_meta:
  version: "1.0.0"
  _status: aspirational
  schema_id: "lightwave://schemas/integrations/forgejo/issue_comment"
  title: "Forgejo Issue Comments + Labels + Milestones + Reactions + Stopwatch + Tracked Time — 1:1 SST Mirror"
  description: "Consolidated remaining issue sub-resources."
  source_ref: "forgejo://swagger.v1.json issue sub-paths"
  table_kind: entity
  table_name: issue_comments
  generates: ["go:ForgejoComment"]
primary_key: {column: id, type: uuid}
required_fields:
  - {name: issue_ref, type: str, storage: db, indexed: true}
  - {name: body, type: str, storage: db}
  - {name: poster, type: str, storage: db}
  - {name: created_at, type: datetime, storage: db}
  - {name: updated_at, type: datetime, storage: db}
optional_fields:
  - {name: original_author, type: str, storage: db}
  - {name: attachments, type: "list[Attachment]", storage: db, column_type: jsonb}
example:
  issue_ref: "42"
  body: "Working on this — will have a PR up soon."
  poster: "v-platform-developer"
  created_at: "2026-06-25T00:00:00Z"
  updated_at: "2026-06-25T00:00:00Z"
