_meta:
  version: "1.0.0"
  _status: aspirational
  schema_id: "lightwave://schemas/integrations/forgejo/user_variable"
  title: "Forgejo User Action Variable — 1:1 SST Mirror"
  source_ref: "forgejo://swagger.v1.json#/paths/~1user~1actions~1variables"
  description: "User-level action variable (key-value) for Forgejo CI/CD workflows."
  table_kind: entity
  table_name: user_action_variables
  generates: ["go:ForgejoUserVariable"]
primary_key: { column: id, type: uuid }
natural_key: { column: name, unique: false }
required_fields:
  - { name: name, type: str, storage: db }
  - { name: value, type: str, storage: db }
  - { name: user_ref, type: str, storage: db, indexed: true }
  - { name: created_at, type: datetime, storage: db }
example:
  name: "GO_VERSION"
  value: "1.24"
  user_ref: "v-platform-developer"
  created_at: "2026-06-25T00:00:00Z"
