_meta:
  version: "1.0.0"
  _status: aspirational
  schema_id: "lightwave://schemas/integrations/forgejo/user_secret"
  title: "Forgejo User Action Secret — 1:1 SST Mirror"
  source_ref: "forgejo://swagger.v1.json#/paths/~1user~1actions~1secrets"
  description: "User-level action secret for Forgejo CI/CD workflows."
  table_kind: entity
  table_name: user_action_secrets
  generates: ["go:ForgejoUserSecret"]
primary_key: { column: id, type: uuid }
natural_key: { column: name, unique: false }
required_fields:
  - { name: name, type: str, storage: db }
  - {
      name: data,
      type: str,
      description: "Encrypted secret value",
      storage: db,
    }
  - { name: user_ref, type: str, storage: db, indexed: true }
  - { name: created_at, type: datetime, storage: db }
example:
  name: "DOCKER_HUB_TOKEN"
  data: "<encrypted>"
  user_ref: "v-platform-developer"
  created_at: "2026-06-25T00:00:00Z"
