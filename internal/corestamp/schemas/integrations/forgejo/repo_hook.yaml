_meta:
  version: "1.0.0"
  _status: aspirational
  schema_id: "lightwave://schemas/integrations/forgejo/repo_hook"
  title: "Forgejo Webhooks + Deploy Keys + Forks + Mirrors + Content + Tags + Topics — 1:1 SST Mirror"
  description: |
    Consolidated schema for repo-level webhooks, deploy keys, forks, push mirrors,
    file content, tags, and topics. Each sub-category maps to a Forgejo API path.
  source_ref: "forgejo://swagger.v1.json consolidated repo sub-paths"
  table_kind: entity
  table_name: repo_webhooks
  generates: ["go:ForgejoWebhook"]
primary_key: {column: id, type: uuid}
required_fields:
  - {name: repo_ref, type: str, storage: db, indexed: true}
  - {name: type, type: str, description: "forgejo|dingtalk|discord|gitea|gogs|msteams|slack|telegram|feishu|wechatwork|packagist", storage: db}
  - {name: config_url, type: str, storage: db}
  - {name: created_at, type: datetime, storage: db}
  - {name: updated_at, type: datetime, storage: db}
optional_fields:
  - {name: active, type: bool, storage: db}
  - {name: events, type: "list[str]", storage: db, column_type: jsonb}
  - {name: branch_filter, type: str, storage: db}
  - {name: authorization_header, type: str, storage: db}
  - {name: content_type, type: str, storage: db}
example:
  repo_ref: "lightwave-media/lightwave-platform"
  type: "forgejo"
  config_url: "https://hooks.lightwave-media.local/webhook"
  active: true
  events: ["push", "pull_request", "release"]
  created_at: "2026-06-25T00:00:00Z"
  updated_at: "2026-06-25T00:00:00Z"
