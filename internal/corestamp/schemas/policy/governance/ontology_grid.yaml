_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/policy/governance/ontology_grid"
  title: "Ontology Grid — kind-family cells"
  description: |
    Engineering coordinate system for src/schemas kind-families.
    Rows: language, engine, toolchain. Columns: data, logic, action, security.
    Palantir product nouns stay out. Every kind-family occupies exactly one
    cell. Tests walk the tree; unclassified fails.
  generates:
    - "json_schema:ontology_grid"
  depends_on: []

name: ontology_grid
description: "Map of R-14 kind-families onto Language/Engine/Toolchain × Data/Logic/Action/Security"

rows:
  - language
  - engine
  - toolchain
columns:
  - data
  - logic
  - action
  - security

