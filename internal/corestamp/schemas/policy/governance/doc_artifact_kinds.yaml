# =============================================================================
# DOC ARTIFACT KINDS — closed registry of `docs/` document kinds
# =============================================================================
# Every file in a repo's docs/ directory is one of these kinds. The kind is
# declared in frontmatter (md/mdx) or a leading `# kind: <name>` comment
# (yaml/json/mmd) and validated by `lw docs check` against:
#   - extension matches `extension`
#   - generated kinds carry `source_commit` matching current HEAD
#   - frontmatter contains every key in `frontmatter_required`
#   - body contains a level-2 heading for every entry in `required_sections`
#
# docs/ is DESCRIPTIVE — these documents must reflect the code as it is now.
# Kinds with non-empty `refresh_source` are regenerated by `lw docs sync` from
# the named inputs; drift between source SHA and `source_commit` frontmatter
# is reported by `lw docs check` and (CI/cron) opens a drift PR.
# =============================================================================
_meta:
  version: "0.1.0"
  schema_id: "lightwave://schemas/policy/governance/doc_artifact_kinds"
  title: "Doc Artifact Kinds"
  description: |
    Per-kind shape + refresh-source contract for files under <repo>/docs/.
    Consumed by `lw docs sync` and `lw docs check`.
  generates:
    - "go:DocArtifactKind"
    - "json_schema:doc_artifact_kinds"
  depends_on:
    - "lightwave://schemas/interfaces/cli/commands"

name: "doc_artifact_kinds"

# Determinism rules apply to every generated kind unless overridden per entry.
determinism_defaults:
  list_sort: "alphabetical"
  timestamp_precision: "second"
  timestamp_timezone: "UTC"
  line_endings: "lf"
  trailing_newline: true

doc_artifact_kinds:
  - kind: architecture
    description: "Architecture-of-record — components, boundaries, cross-repo deps"
    extension: ".md"
    frontmatter_required: [kind, generator_version, source_commit, generated_at]
    required_sections: ["Components", "Boundaries", "Cross-Repo Dependencies"]
    refresh_source:
      - kind: file_tree
        roots: ["internal/", "cmd/", "src/", "packages/"]
        ignore_globs: ["**/*_test.go", "**/node_modules/**", "**/dist/**"]
      - kind: go_packages
        when: "go_mod_present"
    validator: "lw docs check"

  - kind: data-flow
    description: "Request/event flow — mermaid sequence diagrams + narrative wrapper"
    extension: ".mmd"
    sibling_extension: ".md"
    # frontmatter_required applies to the .mmd (none — mermaid carries metadata
    # via a leading `%%` comment header). The .md sibling carries the standard
    # generated-doc frontmatter (kind, generator_version, source_commit,
    # generated_at) — same contract as the other generated kinds above.
    frontmatter_required: []
    refresh_source:
      - kind: handlers
        glob: "**/dispatcher.go"
      - kind: openapi
        glob: "**/openapi.{yaml,json}"
    validator: "lw docs check"

  - kind: contract
    description: "Public surface — CLI verbs + exported Go/TS API + env vars + file outputs"
    extension: ".yaml"
    frontmatter_required: []
    header_comments_required: [kind, generator_version, source_commit, generated_at]
    refresh_source:
      - kind: go_exports
        when: "go_mod_present"
      - kind: ts_exports
        when: "package_json_present"
      - kind: commands_yaml
        path: "lightwave-core://src/schemas/interfaces/cli/commands.yaml"
    validator: "lw docs check"

  - kind: dependency-graph
    description: "Direct + transitive dependency inventory; SBOM-style snapshot"
    extension: ".json"
    frontmatter_required: []
    refresh_source:
      - kind: package_managers
        tools: [go, pnpm, cargo, pip]
    validator: "lw docs check"

  - kind: runbook
    description: "How to operate the running system — on-call, incident response"
    extension: ".md"
    frontmatter_required: [kind, owner]
    required_sections: ["Symptoms", "Diagnosis", "Remediation", "Escalation"]
    refresh_source: []          # authored, not generated; shape-linted only
    validator: "lw docs check"

  - kind: command-status
    description: "Per-CLI verb trust registry — verified vs decommissioned"
    extension: ".md"
    frontmatter_required: [kind, generator_version, source_commit, generated_at]
    required_sections: ["Verified", "Decommissioned"]
    refresh_source:
      - kind: go_exports
        symbols: ["VerifiedCommands", "DecommissionedCommands"]
        when: "go_mod_present"
    validator: "lw docs check"

  - kind: auth-graph
    description: "OpenFGA / authz relationship graph + narrative summary"
    extension: ".yaml"
    frontmatter_required: []
    header_comments_required: [kind, generator_version, source_commit, generated_at]
    refresh_source:
      - kind: openfga_model
        when: "openfga_present"
      - kind: middleware_scan
        glob: "**/*auth*"
    validator: "lw docs check"
