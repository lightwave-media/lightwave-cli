_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/policy/security/daemon_secrets"
  title: "Daemon-Launch Secret-Loading Contract"
  description: |
    How agent daemons (v_core, lightwave-cli daemons, future runtime daemons)
    load secrets at launch time. The locked pattern: launch-wrapper fetches
    from AWS SSM at startup, exports env vars, execs the daemon. The daemon
    reads secrets from env, never from config files.

    Forensic root cause captured 2026-05-25 in ZeroClaw operation: encrypted
    `enc2:...` API keys in ~/.zeroclaw/config.toml are readable by
    `zeroclaw doctor` (model listing works) but the agent loop's FAILOVER
    path fails with "OpenRouter API key not set" because that path reads
    from env, not config. Working pattern (today's launch-daemon.sh) needs
    stamping so it's reusable across runtimes + invariants are explicit.

    Per handoff 2026-05-25-zeroclaw-runtime-ergonomics R4 (should).

    Aligns with CLAUDE.md §5 "Secrets Live in AWS — Always."
  generates:
    - "pydantic:DaemonSecretsContract"
  depends_on:
    - "lightwave://schemas/data/enums/document_statuses"

status_enum: "document_statuses"

required_fields:
  - name: id
    type: str
    description: "Stable identifier (e.g. 'v_core-default', 'lightwave-cli-default')"
  - name: daemon_id
    type: str
    description: "Which daemon this contract applies to (slug — v_core | lightwave-cli | pi | etc.)"
  - name: secret_loadings
    type: "list[SecretLoadingRef]"
    description: |
      Declarative list of which secrets to fetch and how. Sub-schema SecretLoading:
        ssm_path (str, e.g. '/lightwave/prod/OPENROUTER_API_KEY'),
        target_env_var (str, e.g. 'OPENROUTER_API_KEY'),
        soft_fail (bool, continue daemon launch if this individual secret unreachable?),
        aws_region (str, default 'us-east-1'),
        secret_type (enum: SecureString | String — SSM type; SecureString requires decryption),
        notes (str).
  - name: launch_invariants
    type: "LaunchInvariantsRef"
    description: |
      Sub-schema LaunchInvariants — the non-negotiable rules:
        no_plaintext_in_plist (bool, always true): launchd plist MUST NOT contain plaintext secrets;
        no_plaintext_in_systemd_unit (bool, always true): systemd unit files MUST NOT contain plaintext secrets;
        no_plaintext_in_docker_compose (bool, always true): docker-compose.yml MUST NOT contain plaintext secrets;
        no_plaintext_in_config_files (bool, always true): runtime config files MUST NOT contain plaintext secrets (encrypted enc2:... blobs are tolerated but discouraged);
        fetch_before_exec (bool, always true): launch wrapper MUST fetch and export env BEFORE exec'ing the daemon.
  - name: launch_sequence
    type: "list[str]"
    description: "Ordered steps. Default: ['assume_aws_role', 'fetch_each_ssm', 'export_to_env', 'verify_required_present', 'exec_daemon']."

optional_fields:
  - name: required_env_after_load
    type: "list[str]"
    description: "Env vars that MUST be present after secret loading; daemon refuses to start if any missing (unless their secret_loading.soft_fail = true)."
  - name: supported_init_systems
    type: "list[str]"
    description: "Which init systems this contract supports (launchd | systemd | docker_entrypoint | shell_wrapper)."
  - name: failover_behavior
    type: str
    description: "Enum: continue_with_unset | abort_launch | retry_with_backoff. What to do if SSM unreachable for required (non-soft-fail) secret."
  - name: aws_credential_source
    type: str
    description: "Where the launch wrapper gets AWS credentials to call SSM (enum: instance_profile | env | aws_config_profile | sso). Default: aws_config_profile."

relations:
  parent: null
  children: []

example:
  id: "v_core-default"
  daemon_id: "v_core"
  secret_loadings:
    - ssm_path: "/lightwave/prod/OPENROUTER_API_KEY"
      target_env_var: "OPENROUTER_API_KEY"
      soft_fail: false
      aws_region: "us-east-1"
      secret_type: "SecureString"
      notes: "OpenRouter primary cloud LLM gateway. Required for T2/T3 failover paths."
    - ssm_path: "/lightwave/prod/ANTHROPIC_API_KEY"
      target_env_var: "ANTHROPIC_API_KEY"
      soft_fail: true
      aws_region: "us-east-1"
      secret_type: "SecureString"
      notes: "Direct Anthropic SDK access. Soft-fail because OpenRouter relay is the primary path."
    - ssm_path: "/lightwave/prod/NOTION_API_KEY"
      target_env_var: "NOTION_API_KEY"
      soft_fail: true
      aws_region: "us-east-1"
      secret_type: "SecureString"
      notes: "Notion plugin. Soft-fail — daemon launches without Notion if unreachable."
    - ssm_path: "/lightwave/prod/TELEGRAM_BOT_TOKEN"
      target_env_var: "TELEGRAM_BOT_TOKEN"
      soft_fail: false
      aws_region: "us-east-1"
      secret_type: "SecureString"
      notes: "Telegram channel. Required because v_core's sysadmin channel binding (per channel_bindings.yaml) requires it."
  launch_invariants:
    no_plaintext_in_plist: true
    no_plaintext_in_systemd_unit: true
    no_plaintext_in_docker_compose: true
    no_plaintext_in_config_files: true
    fetch_before_exec: true
  launch_sequence:
    - "assume_aws_role"
    - "fetch_each_ssm"
    - "export_to_env"
    - "verify_required_present"
    - "exec_daemon"
  required_env_after_load:
    - "OPENROUTER_API_KEY"
    - "TELEGRAM_BOT_TOKEN"
  supported_init_systems:
    ["launchd", "systemd", "docker_entrypoint", "shell_wrapper"]
  failover_behavior: "abort_launch"
  aws_credential_source: "aws_config_profile"
