_meta:
  version: 1.0.0
  schema_id: lightwave://schemas/policy/security/agent_aws_credentials
  title: Lightwave Agent AWS Credential Policy
  description: "Declares the AWS IAM credential lifecycle for Lightwave agents.\nAgents authenticate via the lightwave-agent\
    \ IAM role (read-only SSM +\nECS describe + ECR read + CloudWatch logs). Elevated operations require\nhuman operator SSO\
    \ approval via lightwave-admin.\n\nAdapted from Gruntwork Runbooks AwsAuth block credential protection:\n  https://runbooks.gruntwork.io/authoring/blocks/awsauth/\n"
  generates:
  - go:AgentAWSCredentialPolicy
  non_generated_sections:
  - iam_policy
  - credential_protection
  depends_on:
  - lightwave://schemas/data/enums/lightwave_iam_roles
  table_kind: entity
  table_name: agent_aws_credentials
primary_key:
  column: id
  type: uuid
required_fields:
- name: agent_persona
  type: str
  description: Persona slug (e.g. v_platform-developer)
  storage: db
  indexed: true
- name: iam_role
  type: str
  description: 'IAM role assigned to this credential. Values from lightwave_iam_roles enum: lightwave-agent (read-only), lightwave-admin
    (operator, requires SSO approval).'
  storage: db
  values_ref: lightwave://schemas/data/enums/lightwave_iam_roles
- name: account_id
  type: str
  description: AWS account ID (${AWS_ACCOUNT_ID})
  storage: db
- name: region
  type: str
  description: Default AWS region
  storage: db
- name: created_at
  type: datetime
  storage: db
  description: ISO 8601 timestamp when these credentials were provisioned.
optional_fields:
- name: allowed_services
  type: list[str]
  description: ssm, ecs, ecr, logs, sts
  storage: db
  column_type: jsonb
- name: requires_operator_approval
  type: bool
  description: True for lightwave-admin operations
  storage: db
- name: session_duration
  type: int
  description: Max session duration in seconds (default 3600)
  storage: db
- name: sso_start_url
  type: str
  description: AWS SSO start URL for operator auth
  storage: db
- name: last_authenticated_at
  type: datetime
  storage: db
  description: ISO 8601 timestamp of the most recent successful authentication.
iam_policy:
  lightwave_agent:
    name: lightwave-agent
    description: Read-only agent access for runtime operations
    statements:
    - effect: Allow
      actions:
      - ssm:GetParameter
      - ssm:GetParametersByPath
      resources:
      - arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/lightwave/prod/*
    - effect: Allow
      actions:
      - ecs:DescribeServices
      - ecs:DescribeTasks
      - ecs:DescribeTaskDefinition
      resources:
      - arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:cluster/lightwave*
      - arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/lightwave*/*
      - arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:task/lightwave*/*
      - arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:task-definition/lightwave*:*
    - effect: Allow
      actions:
      - ecr:GetAuthorizationToken
      resources:
      - '*'
    - effect: Allow
      actions:
      - ecr:BatchCheckLayerAvailability
      - ecr:BatchGetImage
      resources:
      - arn:aws:ecr:${AWS_REGION}:${AWS_ACCOUNT_ID}:repository/lightwave/*
    - effect: Allow
      actions:
      - logs:DescribeLogGroups
      - logs:DescribeLogStreams
      - logs:FilterLogEvents
      - logs:GetLogEvents
      resources:
      - arn:aws:logs:${AWS_REGION}:${AWS_ACCOUNT_ID}:log-group:/lightwave/*
  lightwave_admin:
    name: lightwave-admin
    description: Operator-only elevated access for infra management
    requires: operator_sso_approval
credential_protection:
- rule: strip_credentials_on_startup
  description: When any AwsAuth block is present, strip AWS env vars from session
  applies_to:
  - agent
  - operator
- rule: require_confirmation
  description: Credentials are NEVER available until user explicitly confirms
  applies_to:
  - agent
  - operator
- rule: validate_before_use
  description: STS GetCallerIdentity called before credentials are registered
  applies_to:
  - agent
  - operator
- rule: read_only_detection
  description: Auto-detection reads env vars but does NOT register them
  applies_to:
  - agent
example:
  agent_persona: v_platform-developer
  iam_role: lightwave-agent
  account_id: '738605694078'
  region: us-east-1
  allowed_services:
  - ssm
  - ecs
  - ecr
  - logs
  - sts
  requires_operator_approval: false
  session_duration: 3600
  created_at: '2026-06-25T00:00:00Z'
