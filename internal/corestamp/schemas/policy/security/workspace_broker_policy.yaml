_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/policy/security/workspace_broker_policy"
  title: "Agent Workspace Broker Policy — one registered writable workspace per task and repository"
  description: |
    The tool-agnostic contract every coding client must satisfy before it may
    write in a LightWave repository (CORE-0051; operator ruling 2026-09-01,
    Notion task GTD-1305). Notion is planning-primary (task, repo, sprint,
    execution mode, branch intent); lightwave-core is policy-primary (this
    stamp); lightwave-cli is runtime-primary (the `lw workspace` broker, task
    1303 / lightwave-cli#339); lightwave-ai is an adapter; lightwave-sys is
    not the policy owner.

    The invariant is identity, not location: ONE registered writable Project
    Workspace (data/meta/project_workspace) per (repo, task_ref). Clients that
    support a location or creation hook take the brokered path; clients that
    insist on their own worktree register it in place; clients that can do
    neither are denied write access. There is no silent fallback to the main
    checkout, and no automation ever moves or deletes a live, dirty, locked or
    unpushed tree.

    This stamp declares the root taxonomy, the client capability matrix and
    its fallback chain, the profile composition rule (intersect, never merge),
    the lifecycle and error conditions, and the broker verb surface. It
    implements nothing: the verbs are a contract for lightwave-cli to build
    against. Enforcement test: tests/conformance/test_workspace_broker_contract.py.
  generates:
    - "pydantic:WorkspaceBrokerPolicy"
  depends_on:
    - "lightwave://schemas/data/enums/document_statuses"
    - "lightwave://schemas/data/enums/workspace_clients"
    - "lightwave://schemas/data/enums/workspace_modes"
    - "lightwave://schemas/data/enums/execution_modes"
    - "lightwave://schemas/data/enums/workspace_lifecycle_states"
    - "lightwave://schemas/data/meta/project_workspace"
    - "lightwave://schemas/data/meta/worktree_home_policy"
    - "lightwave://schemas/policy/security/worktree_policy"

status_enum: "document_statuses"

required_fields:
  - name: id
    type: str
    description: "Stable identifier of this policy print (e.g. 'workspace-broker-v1')."
  - name: invariant
    type: "InvariantRef"
    description: |
      The one rule everything else serves. Sub-schema Invariant:
        statement (str), identity_key (list[str] — field names of
        project_workspace that form identity), identity_excludes (list[str] —
        fields that MUST NOT participate in identity), record_schema (str URI).
  - name: root_taxonomy
    type: "RootTaxonomyRef"
    description: |
      Where workspaces may live. Sub-schema RootTaxonomy:
        canonical (kind, root, path_layout, allocated_by, conformance),
        supplemental (list of {client, root, created_by, conformance,
          preferred_path}) — one per workspace_clients value,
        legacy (list of {root, source, disposition}),
        forbidden_for_new_allocation (list[str]),
        visibility_rule (str). Repo-relative roots (no leading ~ or /) resolve
        against each discovered repository root.
  - name: client_capabilities
    type: "list[ClientCapabilityRef]"
    description: |
      One row per workspace_clients value. Sub-schema ClientCapability:
        client (str), can_accept_brokered_path (bool), can_hook_creation
        (bool), creates_own_worktree (bool), can_register (bool),
        supports_removal_signal (bool), evidence (str — vendor doc or
        first-party source the row was read from, with a date).
  - name: fallback_chain
    type: "FallbackChainRef"
    description: |
      Ordered resolution from capabilities to a workspace_modes value.
      Sub-schema FallbackChain: steps (list of {step, requires (list of
      capability keys), verb, results_in (workspace_modes value), terminal
      (bool)}), rule (str). The last step MUST be deny_write and no step may
      resolve a writing session to canonical_checkout.
  - name: composition
    type: "CompositionRef"
    description: |
      How several capability or policy profiles combine on one workspace.
      Sub-schema Composition: mode (enum: intersect), forbidden_modes
      (list[str]), rule (str), applies_to (list[str]).
  - name: lifecycle
    type: "LifecycleRef"
    description: |
      Sub-schema Lifecycle: states_ref (URI of the state-machine enum),
      initial (str), terminal (list[str]), stale_after_minutes (int),
      resume_rule (str).
  - name: error_conditions
    type: "list[ErrorConditionRef]"
    description: |
      Situations that are errors, not states. Sub-schema ErrorCondition:
        code (str slug), detected_by (list of verbs), on_detect (enum: error),
        exit_nonzero (bool), never_silent (bool), diagnostic (str — what the
        message must name).
  - name: broker_verbs
    type: "BrokerVerbsRef"
    description: |
      The `lw workspace` surface lightwave-cli must implement. Sub-schema
      BrokerVerbs: namespace (str), implementation_status (enum:
      not_implemented | in_development | implemented), owner (str repo),
      tracked_by (list[str]), supersedes (str), registration_rule (str),
      verbs (list of {verb, input, reads, output, fails_when, mutates}).
  - name: invariants
    type: "list[InvariantRuleRef]"
    description: |
      Cross-cutting rules. Sub-schema InvariantRule: name (str slug), rule
      (str), enforced_by (list of verbs or hooks), violation_action (enum:
      deny_write | error | propose_only).
  - name: execution_mode_gate
    type: "ExecutionModeGateRef"
    description: |
      Sub-schema ExecutionModeGate: modes_ref (URI), no_workspace_modes
      (list[str]), writable_modes (list[str]). Must partition the enum and
      agree with its writes_permitted flags.
  - name: status
    type: str
    description: "Lifecycle of this policy print (conforms to document_statuses)."

optional_fields:
  - name: observability
    type: "ObservabilityRef"
    description: "Sub-schema Observability: log_to (existing JSONL channel), record_per (list[str]), fields (list[str])."
  - name: rationale
    type: str
    description: "Why the policy is shaped this way; history of the rulings it encodes."

relations:
  parent: null
  children: []

example:
  id: "workspace-broker-v1"
  status: "active"
  invariant:
    statement: "One registered writable Project Workspace per task and repository. Identity, not physical path, is the invariant."
    identity_key: [repo, task_ref]
    identity_excludes: [issue_ref, path, owning_client, branch]
    record_schema: "lightwave://schemas/data/meta/project_workspace"
  root_taxonomy:
    canonical:
      kind: "lightwave_managed"
      root: "~/.worktrees"
      path_layout: "{repo}/{slug}"
      allocated_by: "lw workspace prepare"
      conformance: "registered_at_allocation"
    supplemental:
      - client: "claude_code_desktop"
        root: ".claude/worktrees"
        created_by: "vendor"
        conformance: "conforming_when_registered"
        preferred_path: "brokered_via_hook"
      - client: "claude_code_cli"
        root: ".claude/worktrees"
        created_by: "vendor"
        conformance: "conforming_when_registered"
        preferred_path: "brokered_via_hook"
      - client: "cursor"
        root: "~/.cursor/worktrees"
        created_by: "vendor"
        conformance: "conforming_when_registered"
        preferred_path: "register_native"
      - client: "codex"
        root: "$CODEX_HOME/worktrees"
        created_by: "vendor"
        conformance: "conforming_when_registered"
        preferred_path: "register_native"
      - client: "opencode"
        root: null
        created_by: "none"
        conformance: "conforming_when_registered"
        preferred_path: "brokered_via_launch_dir"
      - client: "lightwave_runtime"
        root: "~/.worktrees"
        created_by: "broker"
        conformance: "registered_at_allocation"
        preferred_path: "brokered_via_adapter"
    legacy:
      - root: ".worktrees"
        source: "CORE-0047 canonical root, 2026-08-09 to 2026-09-02"
        disposition: "register_in_place_then_drain"
      - root: "~/dev/.worktrees"
        source: "ad-hoc sibling checkouts (ADR-0037 forbidden, still populated)"
        disposition: "register_in_place_then_drain"
      - root: "~/.worktrees/issue-{n}"
        source: "lw worktree create, Paperclip era"
        disposition: "register_in_place_then_drain"
    forbidden_for_new_allocation:
      - "~/.lightwave/worktrees"
      - "~/.lightwave/.worktrees"
      - "~/dev/.worktrees"
      - ".worktrees"
    visibility_rule: "Every root above is scanned. A tree under any root without a project_workspace record is reported as nonconforming; it is never omitted from scan output, and a scan that could not read a root is an error, not an empty result."
  client_capabilities:
    - client: "claude_code_desktop"
      can_accept_brokered_path: true
      can_hook_creation: true
      creates_own_worktree: true
      can_register: true
      supports_removal_signal: true
      evidence: "code.claude.com/docs/en/hooks 2026-09-02: WorktreeCreate replaces native creation and must return hookSpecificOutput.worktree_path; WorktreeRemove fires at session exit; any non-zero exit aborts."
    - client: "claude_code_cli"
      can_accept_brokered_path: true
      can_hook_creation: true
      creates_own_worktree: true
      can_register: true
      supports_removal_signal: true
      evidence: "code.claude.com/docs/en/worktrees 2026-09-02: --worktree and subagent isolation default to <repo>/.claude/worktrees/<name> on branch worktree-<name>; the same hooks apply."
    - client: "cursor"
      can_accept_brokered_path: false
      can_hook_creation: false
      creates_own_worktree: true
      can_register: true
      supports_removal_signal: false
      evidence: "worktree_home_policy v1.x supplemental root ~/.cursor/worktrees (ADR-0037); no documented creation hook."
    - client: "codex"
      can_accept_brokered_path: false
      can_hook_creation: false
      creates_own_worktree: true
      can_register: true
      supports_removal_signal: false
      evidence: "learn.chatgpt.com/docs/environments/git-worktrees 2026-09-02: managed worktrees under $CODEX_HOME/worktrees, root configurable in Settings > Worktrees, detached HEAD, retention keeps 15, no hook."
    - client: "opencode"
      can_accept_brokered_path: true
      can_hook_creation: false
      creates_own_worktree: false
      can_register: true
      supports_removal_signal: false
      evidence: "opencode.ai/docs/custom-tools 2026-09-02: runs in the launch directory and exposes context.directory + context.worktree to plugins; creates no worktree."
    - client: "lightwave_runtime"
      can_accept_brokered_path: true
      can_hook_creation: true
      creates_own_worktree: false
      can_register: true
      supports_removal_signal: true
      evidence: "first-party adapter in lightwave-ai; calls the broker and defines no second policy (ruling 2026-09-01)."
  fallback_chain:
    steps:
      - step: "brokered"
        requires: [can_accept_brokered_path]
        verb: "prepare"
        results_in: "lightwave_managed_worktree"
        terminal: false
      - step: "register_native"
        requires: [creates_own_worktree, can_register]
        verb: "register"
        results_in: "vendor_managed_worktree"
        terminal: false
      - step: "deny_write"
        requires: []
        verb: null
        results_in: "read_only_checkout"
        terminal: true
    rule: "Evaluate steps in order; the first whose requirements all hold wins. The chain MUST end in deny_write, and no step may resolve a writing session to canonical_checkout. A client that reaches deny_write may read but the session fails before its first write, with a diagnostic naming the missing capability."
  composition:
    mode: "intersect"
    forbidden_modes: ["merge", "union"]
    rule: "When more than one capability or policy profile applies to a workspace, the effective permission set is the INTERSECTION of all of them. A denial in any profile is a denial; profiles never widen each other (the Tauri multi-capability merge is the failure mode this forbids)."
    applies_to: [capability_profiles, execution_mode, workspace_mode]
  lifecycle:
    states_ref: "lightwave://schemas/data/enums/workspace_lifecycle_states"
    initial: "requested"
    terminal: ["cleaned"]
    stale_after_minutes: 30
    resume_rule: "A session resuming a task re-enters its registered workspace (idle or abandoned -> active). It never allocates a second workspace for the same identity key."
  error_conditions:
    - code: "unknown_state"
      detected_by: [scan, prepare, register]
      on_detect: "error"
      exit_nonzero: true
      never_silent: true
      diagnostic: "the path, the registry row (or its absence) and which source disagreed"
    - code: "stale_claim"
      detected_by: [prepare, scan]
      on_detect: "error"
      exit_nonzero: true
      never_silent: true
      diagnostic: "the claim holder, its last heartbeat and the stale window"
    - code: "unreadable_source"
      detected_by: [scan, adopt, prepare]
      on_detect: "error"
      exit_nonzero: true
      never_silent: true
      diagnostic: "which of git worktree list, filesystem roots, registry or liveness could not be read"
    - code: "conflicting_claims"
      detected_by: [prepare, register, scan]
      on_detect: "error"
      exit_nonzero: true
      never_silent: true
      diagnostic: "the existing claim's workspace_id, path, claim_holder and heartbeat_at"
    - code: "unregistered_root_write"
      detected_by: [prepare, register]
      on_detect: "error"
      exit_nonzero: true
      never_silent: true
      diagnostic: "the path being written to and the verb that would have registered it"
    - code: "partial_discovery"
      detected_by: [scan]
      on_detect: "error"
      exit_nonzero: true
      never_silent: true
      diagnostic: "every source that failed; zero results with any failed source is an error, never an empty list"
  broker_verbs:
    namespace: "lw workspace"
    implementation_status: "not_implemented"
    owner: "lightwave-cli"
    tracked_by: ["lightwave-cli#339", "notion:GTD-1303"]
    supersedes: "lw worktree create | list | status | gc | prune (Paperclip-era, issue-scoped identity)"
    registration_rule: "Verbs enter interfaces/cli/commands.yaml with the implementing lightwave-cli PR, per the runtime-led precedence for command surfaces; this stamp is the contract that PR must satisfy, verified by lw check schema."
    verbs:
      - verb: "prepare"
        input: ["task_ref"]
        reads: ["execution_mode", "repo", "branch intent", "base_branch", "existing claims", "client capabilities"]
        output: "a registered project_workspace for writable modes, or an explicit no-workspace result for read-only modes"
        fails_when: ["conflicting_claims", "unreadable_source", "base_sha unresolvable", "branch collision", "client reaches deny_write"]
        mutates: true
      - verb: "register"
        input: ["path", "task_ref", "owning_client"]
        reads: ["git worktree metadata", "existing claims"]
        output: "a vendor_managed_worktree record for a tree the client created natively; the path is never relocated"
        fails_when: ["conflicting_claims", "path not a linked worktree", "unregistered_root_write"]
        mutates: true
      - verb: "scan"
        input: ["repo (optional)"]
        reads: ["git worktree list --porcelain", "every root in root_taxonomy", "registry", "session liveness"]
        output: "every tree found, each labelled conforming or nonconforming, with path, repo, branch, upstream_state, dirty and mtime"
        fails_when: ["partial_discovery", "unreadable_source", "unknown_state"]
        mutates: false
      - verb: "adopt"
        input: ["path", "task_ref"]
        reads: ["scan result", "directory mtime"]
        output: "a record for a pre-existing tree, created_at backdated from mtime; never moves the tree"
        fails_when: ["conflicting_claims", "unreadable_source", "live session on the tree"]
        mutates: true
      - verb: "release"
        input: ["task_ref or path"]
        reads: ["dirty", "upstream_state", "lock state", "liveness"]
        output: "claim released; a clean pushed tree is removed after the save gate, a dirty, locked, live or unpushed tree is kept and cleanup is proposed"
        fails_when: ["live claim held by another session", "unreadable_source"]
        mutates: true
  invariants:
    - name: "one_writable_claim_per_identity"
      rule: "At most one project_workspace with a writable workspace_mode and a non-terminal lifecycle_state may exist per (repo, task_ref); a second request fails closed naming the existing claim."
      enforced_by: [prepare, register, scan]
      violation_action: "error"
    - name: "registration_before_first_write"
      rule: "No agent write is permitted until the workspace is registered; allocation without registration is not writable."
      enforced_by: [prepare, register, WorktreeCreate hook]
      violation_action: "deny_write"
    - name: "no_silent_fallback_to_canonical_checkout"
      rule: "A writing session that cannot be brokered or registered is denied; it never falls back to ~/dev/<repo>."
      enforced_by: [prepare, fallback_chain]
      violation_action: "deny_write"
    - name: "planning_sessions_allocate_nothing"
      rule: "Execution modes without writes_permitted create no worktree and hold no claim."
      enforced_by: [prepare, execution_mode_gate]
      violation_action: "deny_write"
    - name: "never_move_or_delete_live_dirty_locked_unpushed"
      rule: "No automation relocates, renames or removes a tree that is live, dirty, locked or has an unpushed upstream_state; cleanup proposes and the operator disposes."
      enforced_by: [release, scan, WorktreeRemove hook]
      violation_action: "propose_only"
    - name: "identity_excludes_issue_id"
      rule: "issue_ref is optional metadata and never part of identity or of any lookup key."
      enforced_by: [prepare, register, adopt]
      violation_action: "error"
    - name: "parallel_work_uses_child_tasks"
      rule: "Parallel implementation on one task uses explicit child tasks with separate branches; two undeclared writers on one branch are rejected."
      enforced_by: [prepare]
      violation_action: "error"
  execution_mode_gate:
    modes_ref: "lightwave://schemas/data/enums/execution_modes"
    no_workspace_modes: [human_only, agent_planning_only]
    writable_modes: [agent_can_edit_locally, agent_can_open_draft_pr, agent_can_open_pr, agent_can_merge]
  observability:
    log_to: "~/.lightwave/observability/worktree_session.jsonl"
    record_per: [prepare, register, adopt, release, "lifecycle transition"]
    fields: ["ts", "verb", "workspace_id", "lifecycle_state", "path", "owning_client", "claim_holder", "outcome"]
  rationale: >
    The 2026-08-31 measurement found 18 worktrees across five conventions
    while `lw worktree list`, `prune --dry-run` and worktree_session.jsonl all
    reported a clean fleet: the adoption model, not the listing, was the
    defect, because identity was the Paperclip issue id and harness worktrees
    have none. The 2026-09-01 ruling replaces "one physical directory" with
    "one registered identity": vendors keep their native behaviour, every tree
    ends up under one identity and one lifecycle, and anything that cannot
    register does not get to write. Fail-closed posture follows
    lightwave-core#484 (converge review). Profile intersection follows
    US-HARNESS-CAP-001's reading of the Tauri capability-merge failure mode.
