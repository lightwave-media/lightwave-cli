_meta:
  version: 1.2.0
  schema_id: lightwave://schemas/data/meta/agent_identity
  title: Agent Identity — Agent Projection of Identities
  table_kind: entity
  table_name: identities
  scope: local
  description: |
    Agent-scoped cells of the Identities table. Parent stamp is `identity`.
    The table key is `identity_id`. On this stamp the same cell is `agent_id`
    when actor_type=agent. Do not invent a third id noun.

    Shared instances (coder-1, nullclaw-1, …) are actor_type=agent with no
    persona_slug, no rbac_role, no tier. Personas bind to nullclaw.

    JWT/session/provider fields live on agent_session, not this row.
  depends_on:
    - lightwave://schemas/data/meta/identity
    - lightwave://schemas/data/enums/actor_types
    - lightwave://schemas/data/enums/identity_statuses
    - lightwave://schemas/data/enums/nullhub_instance_statuses
    - lightwave://schemas/data/enums/null_modules
    - lightwave://schemas/data/enums/persona_rbac_roles
    - lightwave://schemas/data/enums/persona_tiers
    - lightwave://schemas/data/enums/tenant_roles
required_fields:
- name: agent_id
  type: str
  description: >
    Immutable identity key. Same cell as Identities `identity_id` when
    actor_type=agent. Format agt_<hex>. Not the persona slug. Not a UUID.
- name: display_name
  type: str
  description: Human-readable label. Renamable. Same cell as identity.display_name.
- name: status
  type: str
  values_ref: "lightwave://schemas/data/enums/identity_statuses"
  description: Row lifecycle. Same cell as identity.status. Not runtime_status.
optional_fields:
- name: actor_type
  type: str
  values_ref: "lightwave://schemas/data/enums/actor_types"
  description: Discriminator. This stamp is actor_type=agent. Wire lowercase.
- name: persona_slug
  type: str
  description: Canonical persona identifier (e.g. v_cto). Same value as agent_definition.name. Absent on shared module instances.
- name: runtime_status
  type: str
  values_ref: "lightwave://schemas/data/enums/nullhub_instance_statuses"
  description: Live process status of the bound instance (Zig Status). Same cell as null_instance_binding.runtime_status.
- name: module
  type: str
  values_ref: "lightwave://schemas/data/enums/null_modules"
  description: null* module this identity executes as. Personas bind to nullclaw.
- name: instance_name
  type: str
  description: Name under ~/.nullhub/instances/{module}/{instance_name}/.
- name: rbac_role
  type: str
  values_ref: "lightwave://schemas/data/enums/persona_rbac_roles"
  description: Projection of agent_definition.rbac_role. Absent on shared instances. Not tenant_role.
- name: tier
  type: str
  values_ref: "lightwave://schemas/data/enums/persona_tiers"
  description: Projection of agent_definition.tier. Absent on shared instances.
- name: tenant_role
  type: list[str]
  values_ref: "lightwave://schemas/data/enums/tenant_roles"
  description: createOS shell IAM. Agents use [agent]. Not rbac_role.
example:
  agent_id: agt_a1b2c3d4
  actor_type: agent
  persona_slug: v_staff-engineer
  display_name: Staff Engineer
  status: active
  module: nullclaw
  runtime_status: stopped
  instance_name: v_staff-engineer
  rbac_role: agent_staff
  tier: engineer
  tenant_role:
    - agent
