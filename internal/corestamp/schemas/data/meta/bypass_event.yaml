_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/meta/bypass_event"
  title: "Bypass Event Record"
  table_kind: entity
  scope: local
  description: |
    One record per deliberate gate bypass, appended to
    ~/.lightwave/observability/bypass-events.jsonl.

    A bypass is the one sanctioned way past a hard gate, and it is only
    sanctioned because it leaves evidence: the pre-push hook refuses
    LW_SKIP_PRE_PUSH outright unless LW_SKIP_PRE_PUSH_REASON is set and the
    record can be written. That makes this shape load-bearing rather than
    descriptive — if the record cannot be appended, the push is denied.

    Stamped because the emitters had drifted with nothing to check them:
    `policy/governance/repo-infra.yaml` described the bypass in prose only,
    and `audit_event.yaml` covers a different shape entirely (ts / surface /
    agent_id / decision), so nothing validated these records.

    REPO IDENTITY — the field most likely to be got wrong. `repo` is derived
    from the ORIGIN REMOTE, never from the checkout directory name:

        repo = basename(git remote get-url origin), with a trailing slash and
               a `.git` suffix stripped, taking the segment after the last
               `/` or `:` so SSH and HTTPS forms agree.
        Fall back to the directory basename ONLY when no origin is configured.

    Worktree directory names are arbitrary slugs, so a basename-derived value
    silently mislabels every record written from a worktree — which is most of
    them on a machine running 15+ concurrently. The same defect has been fixed
    twice in shell (lightwave-cli's pre-push, the conform.sh regeneration
    heredoc), once in ~/.lightwave/lib/gate/run.sh, and once in
    ~/.claude/hooks/pre-tool-use-worktree.ts, where taking the basename made
    the hook believe the repo was the worktree slug and refuse a sibling
    worktree for being correct (lightwave-core#570). Four independent copies
    of one rule is why it belongs in the stamp.
  generates:
    - "pydantic:BypassEvent"
    - "json_schema:bypass_event"
  depends_on: []

required_fields:
- name: detected_at
  type: str
  description: ISO 8601 UTC timestamp with a trailing Z, written at the moment the bypass is granted — not when the underlying command finishes.
- name: repo
  type: str
  description: "Repository name derived from the origin remote per the rule in the description. Never the checkout directory basename, which is an arbitrary slug in a worktree."
- name: source
  type: str
  description: "Which gate was bypassed, named after the hook or task that would otherwise have blocked — e.g. pre-push."
- name: bypass
  type: str
  description: "The environment variable that granted it, recorded verbatim so an audit can distinguish a whole-gate skip from a single-phase downgrade — e.g. LW_SKIP_PRE_PUSH, LW_OVERRIDE_REVIEW_BLOCK."
- name: reason
  type: str
  description: "Operator-supplied justification, required by the emitter. An issue reference is the useful form, because it turns a bypass into tracked work rather than a one-line excuse nobody revisits."

optional_fields:
- name: actor
  type: str
  description: "Who or what granted the bypass, when the emitter can attribute it (git user.email, or the agent harness identifier). Absent in the current pre-push emitter."
- name: branch
  type: str
  description: "Branch the bypass was granted on. Absent in the current pre-push emitter; useful for telling a one-off from a branch that bypasses habitually."

example:
  detected_at: "2026-09-10T23:07:57Z"
  repo: "lightwave-core"
  source: "pre-push"
  bypass: "LW_SKIP_PRE_PUSH"
  reason: "lightwave-core#519 transport: mise run ci verified green (1230 passed); the in-hook re-run is what SIGPIPEs the pack write"
