_meta:
  version: 1.0.0
  schema_id: lightwave://schemas/data/meta/agent_watch_session
  title: Agent Watch Session
  description: "Models a supervisor agent's watch session over a worker agent or interview\nwith a human user. Adapted from\
    \ Gruntwork Runbooks watch mode\n(`runbooks open --watch`) — monitors for state changes and auto-reloads\ncontext when\
    \ the watched target changes.\n\nTwo patterns:\n1. v_scrum-manager watches worker agents — monitors active sessions,\n\
    \   detects completion/blocks, intervenes when needed (~300ms debounce)\n2. v_product-manager watches interviews — monitors\
    \ human input changes,\n   reloads context when the user provides new answers\n"
  generates:
  - go:AgentWatchSession
  depends_on:
  - lightwave://schemas/data/enums/watch_session_states
  - lightwave://schemas/data/enums/watch_modes
  table_kind: entity
  table_name: agent_watch_sessions
status_enum: watch_session_states
primary_key:
  column: id
  type: uuid
required_fields:
- name: watcher_agent
  type: str
  description: Slug of the watching agent persona (e.g. v_scrum-manager)
  storage: db
  indexed: true
- name: watched_target
  type: str
  description: Slug of the watched agent persona or session ID
  storage: db
  indexed: true
- name: watch_mode
  type: str
  description: 'Target type being watched. Values from watch_modes enum: agent, interview.'
  storage: db
  values_ref: lightwave://schemas/data/enums/watch_modes
- name: status
  type: str
  description: 'Watch session lifecycle state. Values from watch_session_states enum: active, paused, triggered, completed.'
  storage: db
  indexed: true
- name: last_change_at
  type: datetime
  description: Timestamp of last detected state change
  storage: db
- name: created_at
  type: datetime
  storage: db
  description: ISO 8601 timestamp when the watch session was created.
- name: updated_at
  type: datetime
  storage: db
  description: ISO 8601 timestamp of the last update to this record.
optional_fields:
- name: watch_path
  type: str
  description: Observability path being watched (e.g. ~/.lightwave/observability/sessions/{id}/)
  storage: db
- name: debounce_ms
  type: int
  description: Debounce window in ms (default 300)
  storage: db
- name: trigger_condition
  type: str
  description: What condition triggers intervention (e.g. status=blocked, status=completed)
  storage: db
- name: intervention_runbook
  type: str
  description: Runbook to execute when triggered
  storage: db
- name: auto_reload
  type: bool
  description: Auto-reload watcher context on change
  storage: db
  default: true
watch_patterns:
  scrum_manager_over_agents:
    watcher: v_scrum-manager
    targets:
    - v_platform-developer
    - v_staff-engineer
    - v_qa-engineer
    trigger_on:
    - status: blocked
    - status: completed
    - heartbeat: stale
    intervention: sprint-check
  product_manager_over_interview:
    watcher: v_product-manager
    targets:
    - interview:current_user
    trigger_on:
    - input: changed
    - status: ready
    intervention: living-interview
example:
  watcher_agent: v_scrum-manager
  watched_target: v_platform-developer
  watch_mode: agent
  watch_path: ~/.lightwave/observability/sessions/session-abc-123/
  trigger_condition: status=blocked OR status=completed
  intervention_runbook: sprint-check
  auto_reload: true
  status: active
  last_change_at: '2026-06-25T12:00:00Z'
  created_at: '2026-06-25T12:00:00Z'
  updated_at: '2026-06-25T12:00:00Z'
