_meta:
  version: 1.0.0
  schema_id: lightwave://schemas/data/meta/ledger_event
  title: Ledger Event
  table_kind: entity
  scope: local
  description: |
    One append-only row joining INTENT, ACTION and OUTCOME for anything the
    fleet does. Extends audit_event: same identity fields, same correlation_id
    contract (ADR-0037), plus the half that was missing — what the action
    actually produced.

    WHY THIS EXISTS. Every gate on the host fires before an agent acts and
    scores intent with a proxy; almost nothing records the result. With no
    outcome record there is nothing to compare an estimate against, so gates
    are forced to guess from intent, every guess needs a heuristic, and every
    heuristic drifts to always-on or always-off. Measured 2026-09-08: one
    gate had returned pass on 22,577 consecutive calls, another was below
    threshold on 90% of writes, and four rows on the whole machine carried a
    correlation_id. Adding gates cannot fix that; joining what already happens
    can.

    THE ONE RULE. Every emitter — tool hook, CI phase, review persona, PR
    watcher, release plane — writes this shape, and every row caused by the
    same session carries that session's correlation_id. A per-surface channel
    is then a VIEW, never a new file. This is the reuse-first constraint made
    structural: the failure mode it prevents is the one that produced 51
    observability channels, 29 of them silent, that together could not answer
    how much the fleet produces or how often CI fails on it.

    WHAT THIS IS NOT. Not a metrics store, not a trace format, not a
    replacement for failure_record. failure_record stays the triage artifact
    with its own FSM; a ledger row references it. The canonical print is an
    append-only JSONL trail, with a rebuildable index over it per ADR-0002.
  generates:
  - pydantic:LedgerEvent
  depends_on:
  - lightwave://schemas/data/meta/audit_event
  - lightwave://schemas/data/enums/ledger_surfaces
  - lightwave://schemas/data/enums/ledger_outcomes

required_fields:
- name: id
  type: str
  description: Stable event id, unique within the trail. Never reused.
- name: ts
  type: str
  description: ISO 8601 timestamp at which the action completed.
- name: surface
  type: enum
  values_ref: lightwave://schemas/data/enums/ledger_surfaces
  description: Which plane produced the event. Bound vocabulary, not free text.
- name: agent_id
  type: str
  description: Agent persona or human identity that owns the action.
- name: session_id
  type: str
  description: Session the action belongs to.
- name: correlation_id
  type: str
  description: >
    Joins every row caused by one unit of work — prompt to tool calls to CI run
    to PR to deploy. The load-bearing field: a row without it is unjoinable and
    measures nothing. Doubles as the trace id when mirrored to a span sink.
- name: action
  type: str
  description: What was attempted, in the emitter's own vocabulary (Edit, mise run ci, pr.merge).
- name: outcome
  type: enum
  values_ref: lightwave://schemas/data/enums/ledger_outcomes
  description: >
    What happened. Distinct from audit_event.decision, which records what a
    gate permitted — an allowed call that then failed is decision=allow,
    outcome=fail.

optional_fields:
- name: harness
  type: str
  description: Actor surface — claude-code, cursor, pi, codex, github-actions, launchd, human.
- name: contract_task
  type: str
  description: Active validity contract task slug, when one resolved.
- name: intent_ref
  type: str
  description: What the work claims to serve — an issue ref, story id, or routine name.
- name: target
  type: str
  description: Repo-relative path, resource, or identifier the action addressed.
- name: args_hash
  type: str
  description: SHA-256 of the action's arguments, for dedupe without storing payloads.
- name: decision
  type: str
  description: Gate decision inherited from audit_event — allow | deny | pause | complete.
- name: exit_code
  type: int
  description: Process exit code, where the action was a process.
- name: duration_ms
  type: int
  description: Wall-clock duration of the action in milliseconds.
- name: cost_usd
  type: float
  description: Measured cost of the action, where the surface can attribute one.
- name: tokens_input
  type: int
  description: Input tokens consumed, for model-backed surfaces.
- name: tokens_output
  type: int
  description: Output tokens produced, for model-backed surfaces.
- name: model_id
  type: str
  description: >
    Model that served the action. Required in practice for review rows: a
    verdict from a degraded local fallback must not read as equal to the
    primary (lightwave-core#556).
- name: bypass_reason
  type: str
  description: Operator reason. Required when outcome is bypass; a bypass without one is denied.
- name: failure_ref
  type: str
  description: failure_record id this row produced, when the outcome was a failure worth triaging.
- name: violated_invariant
  type: str
  description: The contract the failure proves was broken (ci_gate_event.CiFailure).
- name: expected_structure
  type: str
  description: The implementation shape that satisfies the invariant.
- name: cure_command
  type: str
  description: Deterministic repair steps for the agent that produced the failure.
- name: do_not
  type: str
  description: Circumvention techniques explicitly forbidden — skip, weaken, disable, bypass.
- name: next_verification
  type: str
  description: Exact command that proves the repair.
- name: fingerprint
  type: str
  description: Stable dedupe key derived from repo, gate, invariant and evidence.
- name: repo
  type: str
  description: Repository the action touched, resolved from the origin remote.
- name: branch
  type: str
  description: Branch at the time of the action.
- name: metadata
  type: map[str, str]
  description: Surface-specific payload that does not earn a column.

example:
  id: led-2026-09-10-0f3a91c4
  ts: '2026-09-10T20:14:07Z'
  surface: ci
  agent_id: v_core-package-developer
  session_id: 5fe86a8a-5366-4730-87cc-ccafb36113af
  correlation_id: corr-2026-09-10-ledger-stamp
  action: mise run ci
  outcome: fail
  harness: claude-code
  contract_task: ledger-event-stamp
  intent_ref: lightwave-core#556
  target: src/schemas/data/meta/ledger_event.yaml
  decision: complete
  exit_code: 1
  duration_ms: 91200
  repo: lightwave-core
  branch: feat/ledger-event-stamp
  violated_invariant: The Go binding parses every canonical schema identically.
  expected_structure: bindings/go/schemas mirrors src/schemas byte-for-byte.
  cure_command: Run scripts/sync-go-binding.sh, then re-stage the mirrored files.
  do_not: Do not hand-edit the Go mirror or skip the conformance test.
  next_verification: mise run ci
  fingerprint: lightwave-core:r8:go-binding-parse-drift
