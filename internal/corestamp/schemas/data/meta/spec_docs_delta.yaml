_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/meta/spec_docs_delta"
  title: "Spec ↔ Docs Delta Report"
  description: |
    GENERATED by `lw spec delta`. Structured diff between spec intent
    (spec/ + spec/agile/) and docs reality (machine-generated docs/ only).
    Drives build, test, and scaffold strategy for developer sessions.
  generates:
    - "pydantic:SpecDocsDelta"
  depends_on:
    - "lightwave://schemas/data/enums/delta_gap_kinds"

required_fields:
  - name: source_spec_commit
    type: str
    description: "Git SHA of spec/ tree at generation time"
  - name: source_docs_commit
    type: str
    description: "Git SHA of docs/ tree at generation time"
  - name: generated_at
    type: str
    description: "ISO-8601 timestamp"
  - name: items
    type: "list[DeltaItemRef]"
    description: |
      DeltaItem inline sub-schema: id (str), kind (enum delta_gap_kinds),
      spec_ref (str), docs_ref (str|null), summary (str), priority
      (blocks-release|blocks-story|nice-to-have), scaffoldable (bool),
      scaffold_blueprint (str|null), test_class (str), status
      (open|in_progress|closed).

optional_fields:
  - name: task_scope
    type: str
    description: "When generated with --task, the agile task id scoped"
  - name: release_gate
    type: bool
    description: "True when --release-gate mode; P0/P1 open items fail exit 1"

example:
  source_spec_commit: abc1234
  source_docs_commit: abc1234
  generated_at: "2026-06-18T12:00:00Z"
  items: []
