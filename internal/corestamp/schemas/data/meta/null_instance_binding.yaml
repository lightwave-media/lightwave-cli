_meta:
  version: "1.1.0"
  schema_id: "lightwave://schemas/data/meta/null_instance_binding"
  title: "nullhub Instance Binding"
  table_kind: value_object
  scope: local
  description: |
    Bind a named instance of one null* module for read-only Mission Control
    (config_path + data_path). `module` is a null_modules value.
    Runtime status of that instance is nullhub_instance_statuses, not runner_statuses.

    Live instance dirs: ~/.nullhub/instances/{module}/{name}/.
    SAD-0002 is the name contract.
  generates:
    - "pydantic:NullInstanceBinding"
  depends_on:
    - "lightwave://schemas/data/enums/null_modules"
    - "lightwave://schemas/data/enums/nullhub_instance_statuses"

required_fields:
  - name: module
    type: str
    values_ref: "lightwave://schemas/data/enums/null_modules"
    description: "Which null* module this bind names. Not a synonym — use the directory name."
  - name: config_path
    type: str
    description: "Absolute path to config.json"
  - name: data_path
    type: str
    description: "Absolute path to .db or data_dir"

optional_fields:
  - name: name
    type: str
    description: "Instance name under ~/.nullhub/instances/{module}/{name}/ (persona slug for agent gateways)."
  - name: runtime_status
    type: str
    values_ref: "lightwave://schemas/data/enums/nullhub_instance_statuses"
    description: "Live supervisor status from GET /api/instances (Zig Status)."
  - name: nullhub_instance
    type: str
    description: "Parent nullhub instance slug when nested"
  - name: persona_ref
    type: str
    description: "v_* persona slug when this instance maps to an agent role (null for shared gateways)"
  - name: runtime
    type: str
    description: "native | container | pod — execution driver (nullhub supervisor backend)"
  - name: lifecycle
    type: str
    description: "persistent | ephemeral — auto_start gateways vs on-demand agent jobs"
  - name: launch_mode
    type: str
    description: "nullhub launch_mode token as stored in ~/.nullhub/state.json (gateway, server, serve, agent, …)"

example:
  module: nullclaw
  name: v_staff-engineer
  runtime_status: stopped
  persona_ref: v_staff-engineer
  launch_mode: gateway
  config_path: /Users/dev/.nullhub/instances/nullclaw/v_staff-engineer/config.json
  data_path: /Users/dev/.nullhub/instances/nullclaw/v_staff-engineer/state.db
