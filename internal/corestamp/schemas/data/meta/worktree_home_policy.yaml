_meta:
  version: "2.0.0"
  schema_id: "lightwave://schemas/data/meta/worktree_home_policy"
  title: "Worktree home directory policy"
  description: |
    Company-wide layout for agent git worktrees (ADR-0037, CORE-0047, CORE-0051).
    Consumed by lw git audit, lw git doctor, lw workspace prepare/register/scan,
    lw release propagate, session_spawn, and the Claude Code
    WorktreeCreate/WorktreeRemove hooks.

    v2.0.0 (CORE-0051, GTD-1305): the invariant is one registered writable
    Project Workspace per task and repository, not one physical root.
    canonical_root moves to the operator-ruled ~/.worktrees with layout
    {repo}/{slug} (ruling 2026-08-31; outside every repo, so a Stop-hook
    `git add -A` can never stage a worktree as a gitlink again). Supplemental
    roots are the vendor roots declared in
    policy/security/workspace_broker_policy.root_taxonomy: a tree there is
    conforming when it carries the project_workspace record and nonconforming
    when it does not — never invisible. .claude/worktrees therefore leaves
    forbidden_roots and becomes a supplemental root (Claude Code still takes
    the brokered path through its WorktreeCreate hook when the hook is
    registered). The v1.x canonical <repo>/.worktrees joins legacy_roots and
    forbidden_roots: no NEW allocation there; the eleven existing trees are
    registered in place by lw workspace adopt (task 1303) and drain, never
    moved. Repo-relative entries (no leading ~ or /) resolve against each
    discovered workspace repo root.

    v1.1.0 (CORE-0047): .claude/worktrees legacy AND forbidden; harness
    redirected to <repo>/.worktrees via WorktreeCreate. Superseded above.
  depends_on:
    - "lightwave://schemas/data/meta/homedir"
    - "lightwave://schemas/data/meta/local_setup_profile"
    - "lightwave://schemas/policy/security/workspace_broker_policy"

required_fields:
  - name: canonical_root
    type: str
    description: "Root for LightWave-managed worktrees: ~/.worktrees (CORE-0051). Outside every repo; NOT a ~/.lightwave/ dir."
  - name: path_layout
    type: str
    description: "Relative layout under canonical_root. Locked: {repo}/{slug}, where slug derives from the task's branch intent (worktree_policy.repo_structure.naming)."
  - name: marker_file
    type: str
    description: "Required metadata file at worktree root (.lw-worktree.yaml): the on-disk print of the project_workspace record."
  - name: supplemental_roots
    type: "list[SupplementalWorktreeRoot]"
    description: |
      Vendor roots that may hold registered workspaces. Sub-schema
      SupplementalWorktreeRoot: path (str), client (workspace_clients value),
      conformance (enum: registration_required). The full per-client list is
      the broker policy's root_taxonomy.supplemental; this example shows shape.
  - name: forbidden_roots
    type: "list[str]"
    description: "Roots where NO new worktree may be allocated. Trees already there are legacy: registered in place and drained, never moved."
  - name: enforcement_surfaces
    type: "list[str]"
    description: "Tools that MUST evaluate this policy."

optional_fields:
  - name: legacy_roots
    type: "list[str]"
    description: "Deprecated roots; audit emits legacy_worktree_layout for each unregistered tree until adopted and drained."
  - name: branch_prefixes
    type: "list[str]"
    description: "Allowed branch prefixes inside worktrees."
  - name: identity_ref
    type: str
    description: "URI of the record every worktree under any root must carry (data/meta/project_workspace)."

example:
  canonical_root: "~/.worktrees"
  path_layout: "{repo}/{slug}"
  marker_file: ".lw-worktree.yaml"
  identity_ref: "lightwave://schemas/data/meta/project_workspace"
  supplemental_roots:
    - path: ".claude/worktrees"
      client: claude_code_desktop
      conformance: registration_required
    - path: "~/.cursor/worktrees"
      client: cursor
      conformance: registration_required
    - path: "~/.codex/worktrees"
      client: codex
      conformance: registration_required
  forbidden_roots:
    - "~/.lightwave/worktrees"
    - "~/.lightwave/.worktrees"
    - "~/dev/.worktrees"
    - ".worktrees"
  legacy_roots:
    - "~/.lightwave/worktrees"
    - "~/.lightwave/.worktrees"
    - "~/dev/.worktrees"
    - ".worktrees"
    - "~/.worktrees/issue-{n}"
  branch_prefixes:
    - "feat/"
    - "feature/"
    - "fix/"
    - "hotfix/"
    - "chore/"
    - "docs/"
  enforcement_surfaces:
    - lw workspace prepare
    - lw workspace register
    - lw workspace scan
    - lw workspace adopt
    - lw git audit
    - lw git doctor
    - lw release propagate
    - session_spawn
    - task_done
    - WorktreeCreate hook
    - WorktreeRemove hook
