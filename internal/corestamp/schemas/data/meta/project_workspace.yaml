_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/meta/project_workspace"
  title: "Project Workspace — identity record for one writable task workspace"
  description: |
    The registered identity of ONE writable workspace for ONE task in ONE
    repository (CORE-0051, Notion task GTD-1305). The invariant the broker
    enforces is one registered writable Project Workspace per (repo, task_ref)
    — not one physical directory every client must natively use. Vendor-created
    worktrees are legal when they carry this record; a tree without it is
    nonconforming, never invisible.

    Identity is `identity_key` = (repo, task_ref). The path is where the
    workspace currently lives, the owning client is who holds it, and the
    issue reference is optional metadata: harness worktrees have no issue id,
    so an issue id can never be the key (the defect behind lightwave-cli#339).

    On disk this record is printed as the `.lw-worktree.yaml` marker at the
    workspace root (worktree_policy.repo_structure.claim); in the registry it
    is the row `lw workspace scan` reconciles against git's worktree list, the
    filesystem roots and session liveness. Lifecycle, root taxonomy, client
    capabilities and error conditions are declared once in
    policy/security/workspace_broker_policy; this schema is the record shape.
  generates:
    - "pydantic:ProjectWorkspace"
    - "go:ProjectWorkspace"
  depends_on:
    - "lightwave://schemas/data/enums/workspace_clients"
    - "lightwave://schemas/data/enums/workspace_modes"
    - "lightwave://schemas/data/enums/execution_modes"
    - "lightwave://schemas/data/enums/git_upstream_states"
    - "lightwave://schemas/data/enums/workspace_lifecycle_states"
    - "lightwave://schemas/data/enums/workspace_terminal_outcomes"
    - "lightwave://schemas/data/meta/worktree_home_policy"
    - "lightwave://schemas/policy/security/workspace_broker_policy"

identity_key: [repo, task_ref]

required_fields:
  - name: workspace_id
    type: str
    description: "Stable id derived from the identity key as `<repo_slug>:<task_ref>` (e.g. lightwave-core:GTD-1305). Never a path and never an issue id."
  - name: task_ref
    type: str
    description: "Planning-primary task reference from the Global Tasks DB (GTD-NNNN). Half of the identity key."
  - name: repo
    type: str
    description: "Canonical repository slug `owner/name` (e.g. lightwave-media/lightwave-core). The other half of the identity key."
  - name: branch
    type: str
    description: "The one branch intent for this task (Notion `Branch Name`); two undeclared writers on one branch are rejected."
  - name: path
    type: str
    description: "Absolute path of the workspace root on this machine. Descriptive, never identity; a vendor-managed path is never relocated."
  - name: owning_client
    type: str
    values_ref: "lightwave://schemas/data/enums/workspace_clients"
    description: "The coding client that holds this workspace; selects the capability row in the broker policy."
  - name: workspace_mode
    type: str
    values_ref: "lightwave://schemas/data/enums/workspace_modes"
    description: "Which execution surface this is (LightWave-managed, vendor-managed, canonical or read-only); mirrors Notion Workspace Mode."
  - name: base_branch
    type: str
    description: "Branch the workspace branch was created from, normally main."
  - name: base_sha
    type: str
    description: "Full commit SHA of base_branch at allocation time; the broker refuses an unresolvable base."
  - name: execution_mode
    type: str
    values_ref: "lightwave://schemas/data/enums/execution_modes"
    description: "Notion Execution Mode rung the task was prepared under; modes without writes_permitted allocate no workspace."
  - name: capability_profiles
    type: "list[str]"
    description: "Ids of the capability profiles bound to the run (e.g. blueprint, implement per lightwave-core#517). Multiple profiles INTERSECT, never merge; an empty list means only the execution mode constrains writes."
  - name: claim_holder
    type: str
    description: "Session id of the current writer claim, or of the last one while idle or abandoned. Exactly one live claim exists per identity key."
  - name: created_at
    type: str
    description: "ISO 8601 timestamp the record was registered (for adopted trees: backdated from the directory mtime, never by renaming the path)."
  - name: heartbeat_at
    type: str
    description: "ISO 8601 timestamp of the last liveness beat from claim_holder; older than the policy's stale window means the claim is stale."
  - name: dirty
    type: bool
    description: "True when the tree has uncommitted tracked changes or untracked files; a dirty tree is never moved or deleted by automation."
  - name: upstream_state
    type: str
    values_ref: "lightwave://schemas/data/enums/git_upstream_states"
    description: "Relationship of branch to its upstream; `unpushed` values block any automated removal."
  - name: lifecycle_state
    type: str
    values_ref: "lightwave://schemas/data/enums/workspace_lifecycle_states"
    description: "Current lifecycle state; transitions are the enum's can_transition_to graph and nothing else."

optional_fields:
  - name: terminal_outcome
    type: str
    values_ref: "lightwave://schemas/data/enums/workspace_terminal_outcomes"
    description: "Why the workspace ended; set only once lifecycle_state is cleaned, absent before. An outcome, not a state — `cleaned` is the state, this records which of the four ways the workspace got there."
  - name: issue_ref
    type: str
    description: "GitHub issue this task tracks (e.g. lightwave-core#514). Optional metadata only — MUST NOT be used as identity; harness worktrees carry none."
  - name: native_root
    type: str
    description: "For vendor-managed workspaces, the vendor root the path lives under (e.g. ~/.codex/worktrees) as declared in the broker policy's root taxonomy."
  - name: marker_file
    type: str
    description: "Relative name of the on-disk print of this record at the workspace root (default .lw-worktree.yaml)."
  - name: notes
    type: str
    description: "Operator notes; not consumed by the broker."

relations:
  parent: null
  children: []

example:
  workspace_id: "lightwave-core:GTD-1305"
  task_ref: "GTD-1305"
  repo: "lightwave-media/lightwave-core"
  branch: "feat/agent-workspace-broker-contract"
  path: "/Users/joelschaeffer/.worktrees/lightwave-core/feat-agent-workspace-broker-contract"
  owning_client: "claude_code_desktop"
  workspace_mode: "lightwave_managed_worktree"
  base_branch: "main"
  base_sha: "d64081a159faa30ea7ac3fec21d2716d3a4a8410"
  execution_mode: "agent_can_open_draft_pr"
  capability_profiles: ["blueprint"]
  claim_holder: "session-0bd0d1dd"
  created_at: "2026-09-02T17:51:00Z"
  heartbeat_at: "2026-09-02T18:20:00Z"
  dirty: false
  upstream_state: "none"
  lifecycle_state: "active"
  issue_ref: "lightwave-core#514"
  marker_file: ".lw-worktree.yaml"
