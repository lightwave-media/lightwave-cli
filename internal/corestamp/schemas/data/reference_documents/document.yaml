_meta:
  version: "0.1.0"
  schema_id: "lightwave://schemas/data/reference_documents/document"
  title: "Document"
  table_kind: document
  scope: local
  table_name: documents
  description: |
    The local file index for every spec kind that has no table of its own —
    the catch-all that makes a host's ~/.lightwave/specs tree queryable in
    full rather than in part.

    This table is not new. It has existed since the SQLite index as
    DOCUMENTS_FALLBACK_DDL, a hardcoded string in src/generators/index_schema.py,
    carrying the comment that states its whole purpose: "Vault kinds without
    stamp coverage land here rather than being silently dropped." What it never
    had was a schema. So when the store moved to Postgres — where the generator
    emits from schema files and nothing else — a table that no schema declared
    could not be emitted, and the catch-all silently stopped existing.

    Measured on this host: 170 files under ~/.lightwave/specs, 46 indexed, 112
    dropped — every task, user story, epic, sprint, PRD, SAD, NFR and product
    vision — with nothing reporting a gap, because the component whose job was
    to report exactly that gap was the component that went missing. Agents then
    searched the filesystem for state the store was refusing to hold.

    Stamping it replaces the hand-written DDL with a generated one, so the two
    printers emit the same table from the same source instead of one of them
    carrying it as a Python string.

    Why NOT local `tasks`/`epics`/`sprints` tables instead. Those names belong
    to agile_artifacts — tenant-scoped ENTITY records behind the Go API, where
    the row IS the artifact. Locally these are files, and a row is a POINTER to
    one. Two stores using one name for two different things is the drift the
    scope axis exists to prevent, so the local side keeps the honest generic
    name and carries the artifact's kind as data. A kind that outgrows this
    table earns its own document schema and graduates out.

    `kind` is an open vocabulary, deliberately not an enum. A directory this
    schema has never heard of must still be indexed and still be visible; an
    enum would turn "the vault grew a kind" back into "the row is dropped",
    which is the failure being fixed.

    A document table INDEXES files, it does not own them. ADR-0049 holds: the
    files under ~/.lightwave/specs are truth, this is derived and droppable,
    and if dropping it loses data that is a defect in the reindexer.
  generates:
    - "pydantic:Document"
  depends_on:
    - "lightwave://schemas/data/enums/document_statuses"

status_enum: "document_statuses"

# A catch-all's identity takes two columns. `slug` alone is not unique here —
# a task and a user story routinely share the slug `0001-…` — which is exactly
# why `kind` is a column and why this carries the same (kind, slug) key the
# hardcoded fallback always had.
#
# The Postgres emitter reads only `natural_key.column` and so keys this table
# on (tenant_id, source_path) instead, which is the same claim in the other
# direction: one row per indexed file. Teaching that emitter `columns:` too is
# lightwave-cli work, not this PR's.
natural_key:
  columns: [kind, slug]
  unique: true

required_fields:
  - name: kind
    type: str
    description: |
      The spec directory the file was indexed from, verbatim — `task`,
      `user_story`, `prd`. Open vocabulary by design (see description).
    pattern: "^[a-z0-9]+([-_][a-z0-9]+)*$"
  - name: slug
    type: str
    description: |
      Identifier within the kind, from frontmatter where present and otherwise
      the filename stem. Unique per kind, NOT globally — pair it with `kind`.
    pattern: "^[a-z0-9]+([-_.][a-z0-9]+)*$"

optional_fields:
  - name: title
    type: str
    description: |
      Human label from frontmatter (`title:` or `name:`). Absent on markdown
      prints that carry no frontmatter at all, which is common and is not an
      error — readers fall back to slug.
  - name: status
    type: str
    description: "Lifecycle status; one of: draft | active | archived."
  - name: body_excerpt
    type: str
    description: |
      Leading prose of the document, so a list view can show what a file is
      about without opening it. An excerpt, never the body: the file is truth
      and this table only points at it.

example:
  kind: task
  slug: 0142-retire-sqlite-index
  title: "Retire the SQLite spec index"
  status: active
  body_excerpt: "The local index moved to Postgres; the SQLite store is retired."

status: active
