_meta:
  version: "1.2.0"
  schema_id: "lightwave://schemas/data/reference_documents/agent_handoff"
  title: "Agent Handoff"
  description: |
    Structured inter-agent communication artifact: what the sender
    did/discovered, what they ask the receiver to do (requests + triage,
    v1.1.0), and the typed, dependency-ordered, per-step-verifiable steps[]
    the receiver runs (execution layer, v1.2.0). Stamps the protocol so
    handoffs are uniform, machine-readable, and triageable rather than ad-hoc
    prose. Design + reconciliation with the runbook format and the
    user_prompt.md KICKOFF print: spec/sad/0001 and spec/adr/0010..0013.
    Migrated 2026-05-25 from governance/reference/agent_handoff.yaml
    (Phase 4 file #19).
  generates:
    - "pydantic:AgentHandoff"
  depends_on:
    - "lightwave://schemas/data/enums/handoff_statuses"
    - "lightwave://schemas/data/enums/handoff_block_kinds"
  changelog:
    - version: "1.2.0"
      date: "2026-06-13"
      summary: "Add the EXECUTION layer: optional steps[] (typed verifiable steps, runbook component kinds + per-step success/failure + depends_on/consumes/produces). Backward-compatible — optional; v1.1.0 negotiation-only handoffs still validate. Reconciles the handoff stamp with the runbook format and user_prompt.md print (spec/sad/0001, spec/adr/0010..0013). (The base+profiles model is designed in SAD-0001/ADR-0012; the profile enum is deferred until a second profile has a consumer.)"
    - version: "1.1.0"
      date: "2026-05-25"
      summary: "Triage layer + optional fields (migration from governance/reference/)."

status_enum: "handoff_statuses"

required_fields:
  - name: id
    type: str
    description: "Stable identifier, format: YYYY-MM-DD-<from-agent-slug>-<topic-slug>. Durable across triage state changes; used as the file slug."
  - name: subject
    type: str
    description: "One-line summary of what this handoff is about"
  - name: from_agent
    type: str
    description: "Sender identity — role slug (v_core, v_dev, v_research), session id, or human name (joel)"
  - name: to_agent
    type: str
    description: "Receiver identity — role slug, specific session id, or 'any-claude-code-session'"
  - name: date
    type: date
    description: "ISO date the handoff was generated by the sender"
  - name: context
    type: str
    description: "What the sender did, discovered, or decided that motivated this handoff. The 'why now'. Helps the receiver judge urgency and ground."
  - name: requests
    type: "list[HandoffRequestRef]"
    description: "Structured asks. Sub-schema HandoffRequest: request_id (str, unique within this handoff, e.g. 'R1'), kind (enum: schema_addition|refactor|adr|decision|bug_fix|discussion|deferred_decision|spec_authoring), title (str, imperative), target_path (str|null, sender's SUGGESTED path — receiver has override authority), rationale (str, why this matters), dependencies (list[str], request_ids in this handoff or $refs), priority (enum: must|should|could|defer), acceptance_criteria (list[str])."
  - name: status
    type: str
    description: "Lifecycle state: received | triaged | partially_accepted | accepted | rejected | in_progress | completed"

optional_fields:
  - name: from_session_context
    type: str
    description: "Where the sender was working when the handoff was generated (repo, branch, topic). Helps the receiver judge whether the sender had full context or proposed against an outdated map."
  - name: cross_cutting_principles
    type: "list[str]"
    description: "Architectural principles the sender wants encoded across the requests"
  - name: out_of_scope
    type: "list[str]"
    description: "What the sender explicitly excludes from this handoff (so the receiver doesn't expand scope)"
  - name: suggested_sequence
    type: "list[str]"
    description: "Sender's recommended order for processing the requests (list of request_ids). Receiver may re-order based on dependencies."
  - name: references
    type: "list[str]"
    description: "External URLs, related issues, prior artifacts"
  - name: triage
    type: "list[TriageDecisionRef]"
    description: "Receiver's per-request triage decisions. Sub-schema TriageDecision: request_id (str, matches a request_id above), decision (enum: accept|reject|defer|modify), location_override (str|null, receiver's chosen path if different from sender's suggestion), target_phase (str|null, e.g. 'Phase 4' or 'follow-up sprint'), ticket_ref (str|null, GitHub issue # if filed), notes (str, why this decision)"
  - name: response_artifact_refs
    type: "list[str]"
    description: "$refs to artifacts produced in response to this handoff (new schemas authored, ADRs filed, issues opened, etc.)"
  - name: closed_at
    type: date
    description: "ISO date the handoff was fully closed (all requests resolved). Set when status flips to completed or rejected."
  - name: steps
    type: "list[HandoffStepRef]"
    description: >-
      The EXECUTION layer (v1.2.0): an ordered/DAG set of typed verifiable
      steps the receiver runs, modeled on the runbook component vocabulary.
      HandoffStep is the inline sub-schema referenced as HandoffStepRef (same
      convention as HandoffRequestRef/TriageDecisionRef — nested in
      pydantic:AgentHandoff, not a separate file). Fields:
      step_id (str, unique within this handoff, e.g. 'S1');
      kind (enum, values_ref lightwave://schemas/data/enums/handoff_block_kinds —
      check|command|inputs|template|admonition, the runbook component names);
      title (str, imperative);
      body (str — the instruction/action/predicate/variable-decls/caution,
      depending on kind);
      depends_on (list[str], step_ids that must complete first — the runbook
      id-ref ordering, forms the DAG);
      consumes (list[str]|null — the SOURCE step_ids whose `produces[]` keys
      this step reads, NOT key names; for ordering with no data read, use
      depends_on and leave consumes []/null);
      produces (list[str]|null, named output keys this step emits for downstream
      steps — the runbook RUNBOOK_OUTPUT key=value contract);
      success (str — the PASS contract: the observable state that proves this
      step done, maps runbook successMessage + 'exit 0' semantics);
      failure (str — the FAIL contract: what indicates failure + recovery hint,
      maps runbook failMessage);
      request_ref (str|null, a request_id in requests[] this step executes —
      links negotiation to execution).
      FULL STEP CONTRACT (authoritative in spec/sad/0001 § "The HandoffStep
      contract"): success/failure optionality per kind, ordering-vs-data-flow
      (depends_on ⊇ consumes), the {{ .outputs.<step>.<key> }} access syntax,
      and the M3 enforcement timeline (lw lint handoff). Kept in the SAD so this
      field description does not drift from the spec.

relations:
  parent: null
  children: []

example:
  id: "2026-05-25-v_research-prior-art-claude-api"
  subject: "Findings on Claude API caching for the prompt-builder design"
  from_agent: "v_research"
  to_agent: "v_dev"
  date: "2026-05-25"
  from_session_context: "lightwave-sys/crates/daemon, drafting v_core prompt-builder SAD"
  context: "While drafting the v_core prompt-builder SAD, surfaced 3 caching patterns from Anthropic's prompt-caching docs that affect bundle materialization design. Patterns warrant a decision before SAD finalizes."
  requests:
    - request_id: "R1"
      kind: "decision"
      title: "Confirm cache-breakpoint strategy for per-role bundles"
      target_path: null
      rationale: "Caching by role-id vs role-id+timestamp affects bundle freshness vs cache hit rate"
      dependencies: []
      priority: "must"
      acceptance_criteria:
        - "Decision documented as ADR or in v_core SAD §X"
    - request_id: "R2"
      kind: "schema_addition"
      title: "Add cache-breakpoint config to ai/orchestration/ schemas"
      target_path: "ai/orchestration/prompt_cache.yaml"
      rationale: "Operator should control cache policy per role"
      dependencies: ["R1"]
      priority: "should"
      acceptance_criteria:
        - "YAML schema declares cache_strategy enum, breakpoint_keys"
  status: "received"
  cross_cutting_principles:
    - "Cache policies are operator-tunable, not hardcoded"
  out_of_scope:
    - "Anthropic SDK upgrade (separate concern)"
  suggested_sequence: ["R1", "R2"]
  references:
    - "https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching"
  triage: []
  steps:
    - step_id: "S1"
      kind: "inputs"
      title: "Declare the cache-breakpoint config variables"
      body: "cache_strategy (enum: role-id | role-id+timestamp), breakpoint_keys (list[str])."
      depends_on: []
      consumes: null
      produces: ["cache_strategy", "breakpoint_keys"]
      success: "Both variables are declared with types and an enum option set."
      failure: "A variable is missing a type or the enum lacks options — re-read R2 acceptance_criteria."
      request_ref: "R2"
    - step_id: "S2"
      kind: "command"
      title: "Author ai/orchestration/prompt_cache.yaml"
      body: "Write the schema declaring cache_strategy + breakpoint_keys, conforming to the enums from S1; register it in the orchestration index."
      depends_on: ["S1"]
      consumes: ["S1"]
      produces: ["schema_path"]
      success: "ai/orchestration/prompt_cache.yaml exists and is registered in the sub-index (R-2)."
      failure: "Index registration missing or values_ref not a full lightwave:// URI (R-4/R-5)."
      request_ref: "R2"
    - step_id: "S3"
      kind: "check"
      title: "Validate the new schema"
      body: "Run `mise run ci` (yaml-check + R-rules) against the new schema."
      depends_on: ["S2"]
      consumes: null
      produces: null
      success: "mise run ci is green; R-2/R-4/R-5/R-6 pass for prompt_cache.yaml."
      failure: "Any R-rule fails — fix in place; do not bypass the gate."
      request_ref: "R2"
