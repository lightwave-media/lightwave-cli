_meta:
  version: 0.1.0
  schema_id: lightwave://schemas/data/ui/shell_template
  title: Shell Template — runtime section, mode and role contract
  table_kind: value_object
  scope: local
  description: 'The contract for what a running createOS shell PRESENTS, as distinct

    from app_shell, which declares how the React application is SCAFFOLDED

    (package, router, providers, auth posture). One template of L0 sections is

    inherited by every layer; layers only alias, gate or omit inherited sections

    and add leaf sections of their own. Three orthogonal filters narrow it:

    scope (the layer), mode (a status plane), and identity (role >= min_role).


    This stamps the shape currently hardcoded in the createOS prototype

    shell-contract.js, so DOMAINS, TEMPLATE, MODES and LAYERS become generated

    rather than authored. The prototype literal is the migration target.


    A section names its data source rather than carrying rows, so the same

    template renders against Notion, Postgres or a local cache without the

    contract changing.


    The example below is illustrative cardinality only (R-44). A complete

    status_map covering a section''s whole vocabulary is INSTANCE data and

    belongs in the print under ~/.lightwave/specs/, never here: a filled

    catalog in the library becomes seed data that overrides live state.


    RESOLVED for agile artifacts, 2026-09-12. The stamped per-kind

    vocabularies encoded an issue-tracker triage lifecycle that nothing

    ran on — 882 of 888 task rows held a value those closed enums did not

    contain. Operator ruling: the workspace is canonical. The five enums

    collapsed into agile_statuses, which every agile section now declares.


    STILL OPEN for documents: document_statuses holds three values

    (draft, active, archived) against nineteen live, all emoji-prefixed,

    with zero exact overlap. Until that is ruled on, a knowledge or

    documents section cannot map its vocabulary, and unmapped_status

    decides what the shell shows — which is the behaviour this contract

    exists to make visible rather than silent.

    '
  generates:
  - typescript:ShellTemplate
  - json_schema:shell_template
  depends_on:
  - lightwave://schemas/data/enums/domains

required_fields:
- name: name
  type: str
  description: Shell identifier, kebab-case (e.g. createos). One per product shell.
- name: roles
  type: list[Role]
  description: 'Ordered role ladder, least privileged first. Rank is the list index,
    so a section with min_role N is visible to every role at or above N. Canonical
    values: member, agent, staff, owner, superadmin. Promote to data/enums/ when first
    consumed by codegen (same posture as app_shell.providers).'
- name: sections
  type: list[Section]
  description: The L0 template — the sections every layer inherits. Order is presentation
    order. A layer may relabel, gate or omit an inherited section but never redefine
    its core identity.
- name: modes
  type: list[Mode]
  description: The mode plane — dashboards over the same sections, separated only by
    a status filter. Each mode collects the statuses mapped to it.
- name: status_map
  type: list[StatusMapping]
  description: 'Maps a source status value to a mode key. This is the whole status
    vocabulary the shell understands; a status absent here is unmapped by definition,
    and unmapped_status decides what happens then.'
- name: unmapped_status
  type: enum
  values_ref: lightwave://schemas/data/enums/ui_unmapped_status_policies
  description: 'What the shell does with a status absent from status_map. The enum
    deliberately offers no fall-back-to-a-named-mode option: silently resolving an
    unrecognised status to an active mode is the defect this field exists to make
    unrepresentable. In the prototype, modeOf() returned "home" on every miss, which
    placed 564 of 888 archived or cancelled tasks in the active dashboard.'

optional_fields:
- name: layers
  type: list[Layer]
  nullable: true
  description: Layer overlays on the L0 template. A layer is a position on the life-domain
    tree, so its id is a domain slug, optionally dotted for a sub-domain (software-development.tooling).
    Absent means the shell presents the template unmodified.
- name: description
  type: str
  nullable: true
  description: Human-readable description of this shell template.

sub_schemas:
  Role:
    key:
      type: str
      description: Role identifier, snake_case
    label:
      type: str
      description: Display name for the role
  Section:
    key:
      type: str
      description: Stable section identifier, snake_case. Never changes when a layer
        relabels the section — the label is presentation, the key is identity.
    label:
      type: str
      description: Default display name, overridable per layer
    icon:
      type: str
      description: Icon identifier from the design system's icon set (nullable)
    min_role:
      type: str
      description: Lowest role in `roles` that may see this section
    source:
      type: str
      description: 'Data source this section reads, as a schema_id or a data-source
        identifier. The binding point between the shell and whatever store backs it;
        a section with no resolvable source is a defect, not an empty state.'
    status_enum:
      type: str
      description: 'Name of the enum in data/enums/ carrying this section''s status
        vocabulary — agile_statuses for every agile artifact section, document_statuses
        for knowledge and documents. Follows the status_enum convention already
        used across data/agile_artifacts/. Every status_map entry scoped to this section
        must name a value of this enum; that constraint is what makes an unmapped status
        detectable rather than merely absent. Nullable for a section whose rows carry
        no lifecycle of their own (contacts).'
  Mode:
    key:
      type: str
      description: Mode identifier, snake_case (e.g. home, capture, planning, done)
    label:
      type: str
      description: Display name for the mode tab
    hint:
      type: str
      description: One-line description of what the mode collects (nullable)
  StatusMapping:
    status:
      type: str
      description: 'A value of the status_enum declared by the section this mapping
        is scoped to. Matched verbatim — not normalised, not lowercased, not stripped
        of emoji — so a mapping either matches or is visibly absent. Verbatim matching
        is deliberate: normalising here would silently absorb vocabulary drift that
        the shell should surface.'
    mode:
      type: str
      description: Mode key this status belongs to
    section:
      type: str
      description: Key of the section whose status_enum this mapping draws from. Required
        wherever two sections share a status word with different meaning — "Done" on
        a sprint is not "Done" on a task (nullable only for a shell with a single
        status vocabulary).
  Layer:
    id:
      type: str
      description: Layer identifier — a domains slug, dotted for sub-domains
    chrome:
      type: str
      description: 'Navigation variant for this layer. Canonical values: sidebar, header.'
    overrides:
      type: str
      description: 'Per-section overrides, keyed by section key: a replacement label,
        a raised min_role, or omission. Never a new core shape (nullable)'
    leaf:
      type: str
      description: 'Sections this layer adds that the template does not carry. A leaf
        that re-skins a core section declares which one via alias_of, so nothing invents
        a new primitive (nullable)'

example:
  name: createos
  description: The createOS product shell — one template, three filters.
  roles:
  - key: member
    label: Member
  - key: owner
    label: Owner
  sections:
  - key: tasks
    label: Tasks
    icon: check-circle
    min_role: member
    source: lightwave://schemas/data/agile_artifacts/task
    status_enum: agile_statuses
  - key: contacts
    label: Contacts
    icon: users-01
    min_role: staff
    source: lightwave://schemas/data/ui/tenant
    status_enum: null
  modes:
  - key: home
    label: Now
    hint: Active work
  - key: planning
    label: Planning
    hint: Committed but not started
  - key: done
    label: Done
    hint: Accepted and closed
  status_map:
  - status: in_progress
    mode: home
    section: tasks
  - status: next_up
    mode: planning
    section: tasks
  - status: done
    mode: done
    section: tasks
  unmapped_status: collect
  layers:
  - id: cinematography
    chrome: sidebar
    overrides: 'projects: Productions; sprints: Schedule; stories: Story; documents:
      Paperwork; contacts: Collaborators (min_role staff)'
    leaf: 'script; scenes (alias_of stories); shots (alias_of tasks); locations; equipment'
