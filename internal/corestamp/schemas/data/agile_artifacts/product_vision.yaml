_meta:
  version: "1.3.2"
  schema_id: "lightwave://schemas/data/agile_artifacts/product_vision"
  title: "Product Vision"
  description: "Strategic foundation defining why a product exists, who it's for, and how success is measured. Anchors the R-P-I-V-R lineage. Migrated 2026-05-25 from governance/agile/product_vision.yaml (Phase 4 file #1)."
  generates:
    - "pydantic:Vision"
  depends_on:
    # MIGRATION-PENDING: document_statuses enum lands at src/schemas/data/enums/ when statuses.yaml migrates
    - "lightwave://schemas/data/enums/document_statuses"
    # MIGRATION-PENDING: life_domains enum lands when domains.yaml migrates
    - "lightwave://schemas/data/enums/life_domains"
  table_kind: entity
  table_name: product_visions

status_enum: "document_statuses"

primary_key:
  column: id
  type: uuid

natural_key:
  column: slug
  unique: true

required_fields:
  - name: slug
    type: str
    description: "URL-safe unique identifier; lowercase, hyphen-separated"
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    storage: db
  - name: name
    type: str
    description: "Vision title"
    storage: db
  - name: target_market
    type: str
    description: "Who this is for"
    storage: db
  - name: success_metrics
    type: "list[str]"
    description: "Measurable outcomes"
    storage: db
    column_type: jsonb
  - name: domain
    type: str
    description: "LifeDomain slug; validated against life_domains"
    storage: db
  - name: time_horizon
    type: str
    description: "Planning horizon (e.g. 3-year, 10-year)"
    storage: db
  - name: created_at
    type: datetime
    description: "ISO 8601 timestamp of record creation; auto-populated"
    storage: db
  - name: updated_at
    type: datetime
    description: "ISO 8601 timestamp of last modification; auto-updated"
    storage: db

optional_fields:
  - name: narrative
    type: str
    description: "Long-form story"
    storage: db
  - name: principles
    type: "list[str]"
    description: "Guiding tenets"
    storage: db
    column_type: jsonb
  - name: non_goals
    type: "list[str]"
    description: "Explicit exclusions"
    storage: db
    column_type: jsonb

relations:
  parent: null
  children:
    - market_analysis
    - prd

example:
  slug: "createos-life-os"
  name: "createOS — life OS for Joel"
  target_market: "Solo creative-tech founders running multi-domain operations"
  success_metrics:
    - "All 17 LifeDomain Tasks dispatchable from one inbox"
  domain: "software-development"
  time_horizon: "3-year"
  principles:
    - "One binary"
    - "Local-first"
  non_goals:
    - "Multi-tenant SaaS for other founders"
  created_at: "2026-06-24T12:00:00Z"
  updated_at: "2026-06-24T12:00:00Z"
