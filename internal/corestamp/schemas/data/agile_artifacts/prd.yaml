_meta:
  version: "1.3.2"
  schema_id: "lightwave://schemas/data/agile_artifacts/prd"
  title: "Product Requirements Document"
  description: "Contract between product and engineering. Defines what to build and why, without prescribing how. Migrated 2026-05-25 from governance/agile/prd.yaml (Phase 4 file #5)."
  generates:
    - "pydantic:PRD"
  depends_on:
    - "lightwave://schemas/data/enums/document_statuses"
    - "lightwave://schemas/data/enums/life_domains"
    - "lightwave://schemas/data/agile_artifacts/product_vision"
  table_kind: entity
  table_name: prds

status_enum: "document_statuses"

primary_key:
  column: id
  type: uuid

natural_key:
  column: slug
  unique: true

required_fields:
  - name: slug
    type: str
    description: "URL-safe unique identifier; lowercase, hyphen-separated"
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    storage: db
  - name: name
    type: str
    description: "Product/PRD title"
    storage: db
  - name: vision_ref
    type: str
    description: "Slug of parent product_vision"
    storage: db
    fk_ref: "lightwave://schemas/data/agile_artifacts/product_vision"
    fk_column: slug
    indexed: true
  - name: problem_statement
    type: str
    description: "Concise problem this PRD addresses"
    storage: db
  - name: personas
    type: "list[PersonaRef]"
    description: "Target personas; sub-schema: name, role, jobs_to_be_done"
    storage: db
    column_type: jsonb
  - name: scope_in
    type: "list[str]"
    description: "What's explicitly in scope"
    storage: db
    column_type: jsonb
  - name: scope_out
    type: "list[str]"
    description: "What's explicitly out of scope"
    storage: db
    column_type: jsonb
  - name: domain
    type: str
    description: "LifeDomain slug; validated against life_domains"
    storage: db
  - name: created_at
    type: datetime
    description: "ISO 8601 timestamp of record creation; auto-populated"
    storage: db
  - name: updated_at
    type: datetime
    description: "ISO 8601 timestamp of last modification; auto-updated"
    storage: db

optional_fields:
  - name: success_criteria
    type: "list[str]"
    description: "Measurable success criteria"
    storage: db
    column_type: jsonb
  - name: release_milestones
    type: "list[MilestoneRef]"
    description: "Sequence of release milestones"
    storage: db
    column_type: jsonb
  - name: dependencies
    type: "list[str]"
    description: "External dependencies (other PRDs, infra, vendors)"
    storage: db
    column_type: jsonb

relations:
  parent: product_vision
  parent_fk:
    column: vision_ref
    references: product_visions.slug
    on_delete: RESTRICT
  children:
    - sad
    - nfr
    - epic

example:
  slug: "createos-inbox-agent-dispatch"
  name: "createOS Inbox + Agent Dispatch"
  vision_ref: "createos-life-os"
  problem_statement: "Joel's daily work is split across 17 LifeDomains; today there is no single Ready-Task inbox he or his agents can poll. Tasks rot in Notion."
  personas:
    - name: "Joel"
      role: "Sole operator"
      jobs_to_be_done: "Pick the next Ready Task without thinking about which tool to open"
    - name: "v_core"
      role: "Resident orchestrator daemon"
      jobs_to_be_done: "Poll Ready Tasks and dispatch them to the right agent harness with the right tool bundle"
  scope_in:
    - "Multi-domain Task table"
    - "Ready-state gate enforced server-side"
    - "v_core poll loop reads from the local Postgres store (rebuilt from the ~/.lightwave/specs print)"
  scope_out:
    - "Multi-tenant access for other operators"
    - "Mobile UI"
  domain: "software-development"
  success_criteria:
    - "Time-to-first-Task < 5s after agent wake-up"
    - ">80% of Ready Tasks dispatch without human nudge"
  created_at: "2026-06-24T12:00:00Z"
  updated_at: "2026-06-24T12:00:00Z"
