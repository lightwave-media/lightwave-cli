_meta:
  version: "1.2.2"
  schema_id: "lightwave://schemas/data/agile_artifacts/goal"
  title: "Goal"
  description: |
    The apex of the createOS work spine (Goal → Project → Epic → Sprint → Task).
    A time-bounded strategic objective an operator pursues, aggregating Projects
    that deliver against a measurable outcome. Distinct from product_vision (the
    why/for-whom of a PRODUCT, R-P-I-V-R lineage): a Goal is an operator's own
    objective on the work spine, and a Project may advance a Goal across several
    products. New 2026-06-19 from the createOS decision interview (the shared
    spine Joel named: "Goals, Projects, Epics, Sprints, Tasks").
  generates:
    - "pydantic:Goal"
  depends_on:
    - "lightwave://schemas/data/enums/life_domains"
    - "lightwave://schemas/data/enums/goal_statuses"
    - "lightwave://schemas/data/enums/epic_priorities"
  table_kind: entity
  table_name: goals

status_enum: "goal_statuses"
priority_enum: "epic_priorities"

primary_key:
  column: id
  type: uuid

natural_key:
  column: slug
  unique: true

required_fields:
  - name: slug
    type: str
    description: "URL-safe unique identifier; lowercase, hyphen-separated"
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    storage: db
  - name: name
    type: str
    description: "Goal name (short human-readable label)"
    storage: db
  - name: domain
    type: str
    description: "LifeDomain slug; validated against life_domains"
    storage: db
  - name: status
    type: str
    description: "Lifecycle state; validated against goal_statuses"
    storage: db
    indexed: true
  - name: created_at
    type: datetime
    description: "ISO 8601 timestamp of record creation; auto-populated"
    storage: db
  - name: updated_at
    type: datetime
    description: "ISO 8601 timestamp of last modification; auto-updated"
    storage: db

optional_fields:
  - name: log_line
    type: str
    description: "One-sentence statement of the objective"
    storage: db
  - name: outcome_metric
    type: str
    description: "How achievement is measured (the verifiable success criterion)"
    storage: db
  - name: priority
    type: str
    description: "Priority; validated against the platform-wide P-tier priority enum (epic_priorities)"
    storage: db
  - name: target_date
    type: date
    description: "Date by which the goal should be achieved"
    storage: db

relations:
  parent: null # Goal is the apex of the work spine — no agile parent
  children:
    - project

example:
  slug: "reclaim-creative-time"
  name: "Reclaim creative time"
  domain: "software-development"
  status: "active"
  log_line: "Get the business off the desk so the only thing left is to create."
  outcome_metric: "≥70% of weekly tracked hours in creative/production mode (baseline ~20%)"
  priority: "p1"
  target_date: "2026-12-31"
  created_at: "2026-06-24T12:00:00Z"
  updated_at: "2026-06-24T12:00:00Z"
