_meta:
  version: "1.3.2"
  schema_id: "lightwave://schemas/data/agile_artifacts/nfr"
  title: "Non-Functional Requirements"
  description: "Performance, scalability, security, availability, observability, compliance targets. Pairs with the SAD. Migrated 2026-05-25 from governance/agile/nfr.yaml (Phase 4 file #7) — Augusta example references replaced with v_core."
  generates:
    - "pydantic:NFR"
  depends_on:
    - "lightwave://schemas/data/enums/document_statuses"
    - "lightwave://schemas/data/enums/life_domains"
    - "lightwave://schemas/data/agile_artifacts/prd"
  table_kind: entity
  table_name: nfrs

status_enum: "document_statuses"

primary_key:
  column: id
  type: uuid

natural_key:
  column: slug
  unique: true

required_fields:
  - name: slug
    type: str
    description: "URL-safe unique identifier; lowercase, hyphen-separated"
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    storage: db
  - name: name
    type: str
    description: "NFR artifact title (short label)"
    storage: db
  - name: prd_ref
    type: str
    description: "Slug of parent prd"
    storage: db
    fk_ref: "lightwave://schemas/data/agile_artifacts/prd"
    fk_column: slug
    indexed: true
  - name: performance
    type: "list[NFRRequirement]"
    description: "Performance targets; sub-schema: metric, threshold, measurement_method"
    storage: db
    column_type: jsonb
  - name: scalability
    type: "list[NFRRequirement]"
    description: "Scalability targets"
    storage: db
    column_type: jsonb
  - name: security
    type: "list[NFRRequirement]"
    description: "Security requirements"
    storage: db
    column_type: jsonb
  - name: availability
    type: "list[NFRRequirement]"
    description: "Availability targets (SLA/SLO)"
    storage: db
    column_type: jsonb
  - name: compliance
    type: "list[NFRRequirement]"
    description: "Regulatory/compliance requirements"
    storage: db
    column_type: jsonb
  - name: domain
    type: str
    description: "LifeDomain slug; validated against life_domains"
    storage: db
  - name: created_at
    type: datetime
    description: "ISO 8601 timestamp of record creation; auto-populated"
    storage: db
  - name: updated_at
    type: datetime
    description: "ISO 8601 timestamp of last modification; auto-updated"
    storage: db

optional_fields:
  - name: observability
    type: "list[NFRRequirement]"
    description: "Logging, metrics, tracing, alerting"
    storage: db
    column_type: jsonb
  - name: accessibility
    type: "list[NFRRequirement]"
    description: "WCAG/A11Y targets"
    storage: db
    column_type: jsonb

relations:
  parent: prd
  parent_fk:
    column: prd_ref
    references: prds.slug
    on_delete: RESTRICT
  children:
    - epic

example:
  slug: "createos-inbox-nfrs"
  name: "createOS Inbox NFRs"
  prd_ref: "createos-inbox-agent-dispatch"
  performance:
    - metric: "v_core poll round-trip"
      threshold: "< 100ms p95 from SELECT to dispatch"
      measurement_method: "tests/validation/test_no_pii.py::test_performance_ci_to_event_under_threshold (analogue: ci_to_event.py < 100ms)"
  scalability:
    - metric: "Concurrent Ready-Tasks"
      threshold: "10k rows in local SQLite without N+1"
      measurement_method: "v_core runtime: EXPLAIN on dispatch query (downstream — lightwave-sys)"
  security:
    - metric: "Tenant isolation (downstream Postgres)"
      threshold: "search_path enforced per connection; cross-tenant query rejected"
      measurement_method: "v_core runtime: multi-tenant pytest fixture against platform DB (downstream — lightwave-platform)"
  availability:
    - metric: "Local SQLite + v_core daemon uptime"
      threshold: "99% (single-node, single-operator)"
      measurement_method: "v_core runtime: observability/v_core.jsonl heartbeat events (downstream — lightwave-sys)"
  compliance:
    - metric: "PII at rest in lightwave-core stamp"
      threshold: "0 — schemas describe shape, never content (per R-9)"
      measurement_method: "tests/validation/test_no_pii.py"
  domain: "software-development"
  created_at: "2026-06-24T12:00:00Z"
  updated_at: "2026-06-24T12:00:00Z"
