_meta:
  version: "1.3.2"
  schema_id: "lightwave://schemas/data/agile_artifacts/market_analysis"
  title: "Market Analysis"
  description: "Market sizing, competitive research, and positioning strategy. Sits between product_vision and prd in the R-P-I-V-R lineage. Migrated 2026-05-25 from governance/agile/market_analysis.yaml (Phase 4 file #4)."
  generates:
    - "pydantic:MarketAnalysis"
  depends_on:
    - "lightwave://schemas/data/enums/document_statuses"
    - "lightwave://schemas/data/enums/life_domains"
    - "lightwave://schemas/data/agile_artifacts/product_vision"
  table_kind: entity
  table_name: market_analyses

status_enum: "document_statuses"

primary_key:
  column: id
  type: uuid

natural_key:
  column: slug
  unique: true

required_fields:
  - name: slug
    type: str
    description: "URL-safe unique identifier; lowercase, hyphen-separated"
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    storage: db
  - name: name
    type: str
    description: "Analysis title"
    storage: db
  - name: vision_ref
    type: str
    description: "Slug of parent product_vision"
    storage: db
    fk_ref: "lightwave://schemas/data/agile_artifacts/product_vision"
    fk_column: slug
    indexed: true
  - name: market_size
    type: str
    description: "TAM/SAM/SOM summary"
    storage: db
  - name: competitors
    type: "list[CompetitorRef]"
    description: "Competitor entries; sub-schema: name, strengths, weaknesses, positioning"
    storage: db
    column_type: jsonb
  - name: domain
    type: str
    description: "LifeDomain slug; validated against life_domains"
    storage: db
  - name: created_at
    type: datetime
    description: "ISO 8601 timestamp of record creation; auto-populated"
    storage: db
  - name: updated_at
    type: datetime
    description: "ISO 8601 timestamp of last modification; auto-updated"
    storage: db

optional_fields:
  - name: customer_segments
    type: "list[str]"
    description: "Distinct customer personas/segments"
    storage: db
    column_type: jsonb
  - name: positioning_statement
    type: str
    description: "How we position vs alternatives"
    storage: db
  - name: swot
    type: "dict[str, list[str]]"
    description: "strengths/weaknesses/opportunities/threats; keys: strengths, weaknesses, opportunities, threats"
    storage: db
    column_type: jsonb

relations:
  parent: product_vision
  parent_fk:
    column: vision_ref
    references: product_visions.slug
    on_delete: RESTRICT
  children:
    - prd

example:
  slug: "solo-founder-pkm-market"
  name: "Solo founder PKM market"
  vision_ref: "createos-life-os"
  market_size: "TAM ~$2B knowledge-worker tooling; SAM ~$200M solo creative-tech; SOM realistic top 1% Notion power-users"
  competitors:
    - name: "Notion"
      strengths: ["network effects", "polish"]
      weaknesses: ["multi-tenant cloud", "no local-first"]
      positioning: "general-purpose"
    - name: "Obsidian"
      strengths: ["local-first", "plugin ecosystem"]
      weaknesses: ["no orchestration", "no DB schema"]
      positioning: "PKM only"
  domain: "software-development"
  positioning_statement: "Local-first life OS with native agent dispatch; the gap between Notion's collaboration and Obsidian's notes."
  swot:
    strengths: ["Single-tenant local-first", "SST-driven schema"]
    weaknesses: ["One-person team"]
    opportunities: ["Agent orchestration not yet commoditised"]
    threats: ["Notion adds local mode"]
  created_at: "2026-06-24T12:00:00Z"
  updated_at: "2026-06-24T12:00:00Z"
