_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/enums/workspace_clients"
  title: "Workspace Clients (coding tools that can hold a Project Workspace)"
  description: |
    The coding clients the workspace broker knows how to broker for
    (CORE-0051, GTD-1305). One row per client in
    policy/security/workspace_broker_policy.client_capabilities declares what
    each can do; project_workspace.owning_client binds to this enum so every
    registered workspace names the tool that holds it.

    Adding a client means adding a value here AND a capability row in the
    broker policy in the same PR — tests/conformance/test_workspace_broker_contract.py
    fails when the two drift.
  generates:
    - "pydantic:WorkspaceClient"
  depends_on: []

name: workspace_clients
description: "Coding clients that can own a registered Project Workspace"
default: lightwave_runtime
closed: true
options:
  - value: claude_code_desktop
    label: "Claude Code Desktop"
    description: "Claude Code desktop app; creates a worktree per session natively and honours WorktreeCreate / WorktreeRemove hooks."
  - value: claude_code_cli
    label: "Claude Code CLI"
    description: "Claude Code terminal client; --worktree sessions and subagent isolation use the same hooks as the desktop app."
  - value: cursor
    label: "Cursor"
    description: "Cursor agent harness; creates its own worktrees under ~/.cursor/worktrees with no documented creation hook."
  - value: codex
    label: "Codex"
    description: "OpenAI Codex app; creates managed worktrees under $CODEX_HOME/worktrees (root configurable, no hook)."
  - value: opencode
    label: "OpenCode"
    description: "OpenCode; runs in the directory it is launched in and exposes directory + worktree to plugins, creates no worktree of its own."
  - value: lightwave_runtime
    label: "LightWave local runtime"
    description: "First-party agent runtime (lightwave-ai nullclaw / nullhub); calls the broker directly and defines no second policy."
