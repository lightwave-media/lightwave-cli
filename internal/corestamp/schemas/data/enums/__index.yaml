# =============================================================================
# ENUMS SCHEMA REGISTRY (Category A / kind family: enums)
# =============================================================================
# One enum per file. Each enum schema declares _meta + description + default
# + options list (value, label, description triples). Consumed via $ref by
# other schemas (e.g. agile artifact `status_enum: document_statuses`).
#
# Migrated one-at-a-time from legacy config/constraints/{statuses,
# field_options, ...}.yaml during Phase 4. Each legacy file is a kitchen-sink
# of mixed enums; extraction is surgical and audited — many enums are
# downstream-subsystem concerns that won't migrate at all (CMS, equipment,
# executive reporting, etc.).
# =============================================================================

_meta:
  version: "0.1.0"
  schema_id: "lightwave://schemas/data/enums/__index"
  title: "Enums Schema Registry"
  description: "Maps enum names to their schema files. One enum per file per R-14 (kind-family sub-folders). Slug naming per R-11 (snake_case OR kebab-case)."

