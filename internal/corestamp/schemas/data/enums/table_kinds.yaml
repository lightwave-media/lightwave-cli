_meta:
  version: 1.0.0
  schema_id: lightwave://schemas/data/enums/table_kinds
  title: Table Kinds
  description: |
    Closed enum for the `_meta.table_kind` storage annotation — what a schema
    becomes when it is materialised into a relational store.

    WHY THIS EXISTS. `table_kind` decided real behaviour long before it was
    stamped: `lw codegen go` emits a table only when it reads `entity`, and
    skips everything else silently. The annotation itself appeared only as
    prose in data/agile_artifacts/CHANGELOG.md ("storage-semantic annotations:
    table_kind, table_name, primary_key, natural_key") and was never
    generalised, so 16 schemas in one family carried it and the other 226
    carried nothing. Measured on origin/main 2026-09-13: of 242 data schemas,
    129 are entity-shaped and 20 declare a kind — 109 are shaped like entities
    and declared as nothing.

    The absence was not neutral. An undeclared schema and a deliberate
    non-entity are the same value — absent — so the derived index could not
    distinguish "not a table" from "nobody has said yet", and carried 15
    tables against a library of 427 schemas with no signal that anything was
    missing.

    NOT EVERY SHAPE IS A ROW. That is the point of a closed vocabulary rather
    than a boolean: a component contract describes a React surface, a template
    describes an email body, and neither becomes a row without inverting
    ADR-0049. Declaring those `value_object` and `document` is a positive
    statement that they were considered.
  closed: true
  generates:
  - pydantic:TableKind
  depends_on: []
name: table_kinds
default: value_object
options:
- value: entity
  label: Entity
  description: >
    A first-class record with its own identity and lifecycle. Materialises as
    one table with a UUID primary key. The only value `lw codegen go` emits
    DDL for.
- value: map
  label: Map
  description: >
    A relationship or hierarchy between entities that carries no independent
    identity — scrum_hierarchy is the standing example. Shapes a join or a
    constraint, never a table of its own.
- value: value_object
  label: Value Object
  description: >
    A shape that only ever appears embedded in something else: a component
    contract, a field group, a config block. Has no identity to key on, so a
    table would need a synthetic one and nothing would reference it.
- value: document
  label: Document
  description: >
    Content whose truth is a FILE — an ADR under spec/, a runbook body, an
    email template. Per ADR-0049 the file is truth and the store is a derived
    index over it, so a `document` schema may still produce a table, but that
    table indexes the files (carrying source_path) rather than replacing them.
    Marking these `entity` is how a store quietly becomes a second truth.

example:
  table_kind: entity
