_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/enums/workspace_lifecycle_states"
  title: "Project Workspace Lifecycle States"
  description: |
    Lifecycle of a registered Project Workspace (CORE-0051, Notion task
    GTD-1305). Each option declares `can_transition_to`, so this enum is the
    authoritative state machine that `lw workspace` (lightwave-cli, task 1303 /
    lightwave-cli#339) must implement and that
    data/meta/project_workspace.lifecycle_state binds to.

    Seven states, one terminal:
      requested -> allocated -> registered -> active <-> idle
      active | idle | abandoned -> cleaned      (explicit release, or swept after
                                                 the operator disposes)
      any non-terminal -> abandoned             (claim went stale; tree is kept)
      abandoned -> active                       (a resumed session re-enters its
                                                 registered workspace; it never
                                                 allocates a second one)

    Unknown, stale, unreadable or conflicting state is NOT a state here. Those
    are error conditions declared in policy/security/workspace_broker_policy
    and MUST surface as a non-zero exit with a diagnostic, never as an empty
    result. Graph validity: tests/conformance/test_enum_state_machines.py;
    contract: tests/conformance/test_workspace_broker_contract.py.
  generates:
    - "pydantic:WorkspaceLifecycleState"
  depends_on: []

name: workspace_lifecycle_states
description: "Lifecycle states of a registered Project Workspace, with the legal transitions"
default: requested
closed: true
options:
  - value: requested
    label: "Requested"
    description: "A session asked the broker for a writable workspace; nothing exists on disk yet."
    can_transition_to: [allocated, abandoned]
  - value: allocated
    label: "Allocated"
    description: "Branch and directory exist (brokered or vendor-created) but no registry record yet, so no write is permitted."
    can_transition_to: [registered, abandoned]
  - value: registered
    label: "Registered"
    description: "Identity record written and the single writer claim issued; the first write is now permitted."
    can_transition_to: [active, abandoned]
  - value: active
    label: "Active"
    description: "Live writer claim with a fresh heartbeat; the only writer for this task and repository."
    can_transition_to: [idle, abandoned, cleaned]
  - value: idle
    label: "Idle"
    description: "Registered and clean but no session is writing; heartbeat paused, claim retained for resume."
    can_transition_to: [active, abandoned, cleaned]
  - value: abandoned
    label: "Abandoned"
    description: "Claim expired (stale heartbeat) or the session ended without release; the tree is kept and cleanup is proposed, never automatic. Returning to `active` is a guarded re-claim of THIS workspace — how a crashed session resumes without allocating a second tree for the same (repo, task_ref). The identity stays held while abandoned, so a rival claimant meets conflicting_claims rather than becoming a silent second writer."
    can_transition_to: [active, cleaned]
  - value: cleaned
    label: "Cleaned"
    description: "Directory removed after the save gate ran; the registry record closes with project_workspace.terminal_outcome (workspace_terminal_outcomes) recording why. This state is the what; the outcome is the why."
    is_completed: true
    can_transition_to: []
