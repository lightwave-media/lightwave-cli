_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/enums/ui_unmapped_status_policies"
  title: "UI Unmapped Status Policy Enum"
  description: |
    What a shell does with a source status absent from its status_map.

    Deliberately excludes a "fall back to a named mode" option. Silently
    resolving an unrecognised status to a real mode is the defect this enum
    exists to make unrepresentable: the createOS prototype's modeOf()
    returned "home" on every miss, which placed 564 of 888 archived or
    cancelled tasks in the active dashboard and every one of 1005 documents
    alongside them. A miss must be refused or collected, never guessed.
  generates:
    - "typescript:UnmappedStatusPolicy"
    - "go:UnmappedStatusPolicy"
  depends_on: []

name: ui_unmapped_status_policies
description: "Handling policy for a status absent from the shell's status_map"
default: collect
closed: true
options:
  - value: error
    label: "Error"
    description: "Refuse to render the row and surface the unmapped value; use where a complete vocabulary is a hard requirement"
  - value: collect
    label: "Collect"
    description: "Route the row to a visible Unmapped bucket so the gap is countable on screen rather than absorbed into an active mode"
