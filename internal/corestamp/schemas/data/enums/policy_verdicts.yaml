_meta:
  version: 1.0.0
  schema_id: lightwave://schemas/data/enums/policy_verdicts
  title: Policy Verdicts
  description: |
    Closed enum for policy_decision.verdict — what the deny-first gauntlet
    concluded.

    RELATIONSHIP TO audit_event.decision. audit_event carries `decision` as
    free text documented in prose as "allow | deny | pause | complete". Three
    of those are policy verdicts and one is not: `complete` records that a hook
    finished its own lifecycle, which is an emitter fact, not a judgement about
    the request. Binding the three that are judgements — and deliberately
    leaving `complete` out — is why this is a separate vocabulary rather than a
    values_ref onto audit_event's string.

    This is the collision EPIC-ONTO-001 warns about handled in the open: a
    second name for a stamped concept is the failure mode, so the overlap is
    stated here rather than discovered later. When audit_event.decision is
    converted from prose to a bound field, it should reference this enum plus
    its own lifecycle values — not fork a parallel list.
  closed: true
  generates:
  - pydantic:PolicyVerdict
  depends_on: []
name: policy_verdicts
default: deny
options:
- value: allow
  label: Allow
  description: >
    Every stage passed and evaluation reached `receipt`. The only value that
    permits the effect.
- value: deny
  label: Deny
  description: >
    A stage refused. `stage` names which one, and is required — a denial that
    cannot say what refused it is unexplainable and unappealable.
- value: pause
  label: Pause
  description: >
    Evaluation stopped at `approval` awaiting human authority. Not an allow
    that has not finished: nothing is applied, and the request resumes only on
    an auth_gate_event carrying a verified approval.
