_meta:
  version: "0.2.0"
  schema_id: "lightwave://schemas/data/enums/cineos_doc_types"
  title: "CineOS Doc Type Enum"
  description: |
    Kind of production document a CineDoc holds (doc.doc_type). Closed.

    The 77 display names and their category membership are approved product
    vocabulary (US-CINE-DOC-001); machine ids are derived from them. Each option
    carries `category`, bound to cineos_doc_categories, so the Production
    Documents matrix groups by section without a second lookup table.

    This replaces a v0.1.0 placeholder of seven generic values. `breakdown`
    became `script_breakdown` and `release` became `talent_release_forms`;
    `contract` had no single successor and resolves to the specific agreement
    types (crew_deal_memos, location_agreements). `other` is retained as the
    default so an unclassified import is never lost.

    Applicability (required / optional / not applicable) is NOT here: it is a
    per-production decision, so it is runtime state, not vocabulary.
  generates:
    - "go:CineDocType"
    - "typescript:CineDocType"
    - "zig:CineDocType"
    - "json_schema:cineos_doc_types"
  depends_on:
    - "lightwave://schemas/data/enums/cineos_doc_categories"

