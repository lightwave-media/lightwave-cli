_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/enums/workspace_terminal_outcomes"
  title: "Workspace Terminal Outcomes (why a workspace was cleaned)"
  description: |
    Recorded on project_workspace.terminal_outcome when lifecycle_state reaches
    `cleaned` (CORE-0051, GTD-1305). These are NOT lifecycle states: `cleaned`
    is the single terminal state, and this enum says which of the four ways a
    workspace arrived there — what the fleet sweep, the retro and the
    reliability epic need to count. `released` in particular is the clean,
    deliberate ending (`lw workspace release`); folding it into `cleaned`
    would make a released tree indistinguishable from a reaped one, which is
    the distinction the sweep is built on. Disjointness from the lifecycle
    enum is asserted by tests/conformance/test_workspace_broker_contract.py.
  generates:
    - "pydantic:WorkspaceTerminalOutcome"
  depends_on: []

name: workspace_terminal_outcomes
description: "Why a Project Workspace reached the cleaned state"
default: released
closed: true
options:
  - value: merged
    label: "Merged"
    description: "The task branch merged upstream; the tree was removed after the save gate confirmed nothing unpushed remained."
  - value: closed_without_merge
    label: "Closed without merge"
    description: "The PR or task was closed unmerged; work was preserved on the branch before removal."
  - value: released
    label: "Released"
    description: "The session released its claim explicitly (`lw workspace release`) and the clean tree was removed."
  - value: reaped
    label: "Reaped"
    description: "Removed by a sweep the operator approved item by item after the upstream-gone / idle classification."
