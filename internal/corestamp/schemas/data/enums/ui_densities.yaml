_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/enums/ui_densities"
  title: "UI Densities"
  description: |
    Closed enum of table row densities, mapping directly onto the lightwave-ui
    Table size axis. Consumed by
    `data/ui/mode_render_contract.yaml#/required_fields/density`.

    Two values, deliberately. A third ("focused", "dense") would express
    emphasis, and emphasis is already expressed by `row_limit` — execute mode
    shows one row, which is a stronger focus signal than any row height. Two
    values also keep this a 1:1 map onto the component's existing prop rather
    than a vocabulary the UI must then translate.
  generates:
    - "typescript:UiDensity"
    - "go:UiDensity"
  depends_on: []

name: ui_densities
description: "Table row density — comfortable | compact"
default: "comfortable"
closed: true
options:
  - value: comfortable
    label: "Comfortable"
    description: "lightwave-ui Table size md. The default: reading and orientation modes, where rows are scanned rather than acted on."
    ui_table_size: "md"
  - value: compact
    label: "Compact"
    description: "lightwave-ui Table size sm. For modes that trade row height for count, where the operator is comparing many artifacts at once."
    ui_table_size: "sm"
