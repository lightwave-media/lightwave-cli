_meta:
  version: "0.1.0"
  schema_id: "lightwave://schemas/data/enums/review_executors"
  title: "Review Executor Enum"
  description: |
    Which pipeline executed a review and produced a verdict record. Exists
    for the shadow-mode soak (spec/adr/0005-cutover-shadow-first.md): Run 1
    dispatches the swarm panel in parallel with the incumbent claude-CLI
    pipeline, and parity comparison requires every
    review_panel_verdict record to say which executor produced it.

    Closed enum — adding an executor is a stamp change. Wire encoding is
    kebab-case.

    Lifecycle note: claude-cli exists FOR the soak and is deleted from
    this enum (stamp change, with a verdict-record migration note) once
    the Run-2 cutover makes nullclaw-swarm authoritative — it must not
    linger as a permanent dead value.

    Consumed by data/meta/review_panel_verdict.yaml#executor and by the
    dev/cli.sh shadow-dispatch path (Run 1 PR 4).
  generates:
    - "zig:ReviewExecutor"
  depends_on: []

name: review_executors
description: "Pipeline that executed a review — incumbent claude-CLI shell-out or the nullclaw swarm panel"
default: claude-cli
closed: true
options:
  - value: claude-cli
    label: "Claude CLI (incumbent)"
    description: "Per-persona `claude -p` shell-outs from dev/cli.sh review --converge. Authoritative for the pre-push gate during the Run-1 shadow soak."
  - value: nullclaw-swarm
    label: "NullClaw swarm"
    description: "Panel personas running as nullclaw agents supervised by nullhub. Advisory (shadow) in Run 1; cutover to authoritative is Run 2, on parity evidence."
