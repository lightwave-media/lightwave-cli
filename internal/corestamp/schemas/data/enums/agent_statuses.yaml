_meta:
  version: 1.0.0
  schema_id: lightwave://schemas/data/enums/agent_statuses
  title: Agent Status Enum
  description: 'createOS Task.agent_status — whether an agent is assigned to a

    SemanticTask (pending → running → completed|failed|cancelled). Distinct from

    nullhub_instance_statuses (whether the nullclaw process is up), from

    nulltickets pipeline stages (per-pipeline, not this enum), and from

    runner_statuses (Forgejo CI). Closed enum.


    The empty-string ("") option encodes "no agent assigned yet" — preserved

    from legacy semantics. Future refactor may replace with explicit

    ''unassigned'' value.


    Extracted 2026-05-25 from legacy products/createos/config.yaml.

    '
  generates:
  - pydantic:AgentStatus
  depends_on: []
name: agent_statuses
description: Status values for Task.agent_status — lifecycle of an agent-dispatched
  task
default: ''
closed: true
options:
- value: ''
  label: Not Assigned
  description: Not Assigned option.
- value: pending
  label: Pending
  description: Pending option.
- value: running
  label: Running
  description: Running option.
- value: completed
  label: Completed
  description: Completed option.
- value: failed
  label: Failed
  description: Failed option.
- value: cancelled
  label: Cancelled
  description: Cancelled option.
