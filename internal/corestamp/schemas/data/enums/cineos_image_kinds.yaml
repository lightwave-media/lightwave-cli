    label: "Reference"
    description: "Reference / inspiration image"
  - value: storyboard
    label: "Storyboard"
    description: "Storyboard frame"
  - value: scout
    label: "Scout"
    description: "Location-scout still"
  - value: still
    label: "Still"
    description: "Production still"
  - value: frame_grab
    label: "Frame Grab"
    description: "Frame grab from footage"
