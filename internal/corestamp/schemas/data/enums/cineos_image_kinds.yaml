_meta:
  version: "0.1.0"
  schema_id: "lightwave://schemas/data/enums/cineos_image_kinds"
  title: "CineOS Image Kind Enum"
  description: |
    Role an attached CineImage plays (image.kind). Closed.
  generates:
    - "go:CineImageKind"
    - "typescript:CineImageKind"
