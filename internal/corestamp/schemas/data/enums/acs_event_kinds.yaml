_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/enums/acs_event_kinds"
  title: "ACS Event Kinds"
  description: |
    Closed event vocabulary appended to the agent_event log. One kind per
    durable row. Per-thread `seq` is assigned by libLightwave at append.
    Numeric `abi_value` is the C enum discriminant and is never reused.
  generates:
    - "pydantic:AcsEventKind"
    - "go:AcsEventKind"
    - "ts:AcsEventKind"
    - "rust:AcsEventKind"
    - "c:LwAcsEventKind"
  depends_on: []

name: acs_event_kinds
description: "Durable agent-event kinds written by libLightwave"
default: thread.created
closed: true
options:
  - value: thread.created
    label: "Thread created"
    description: "A thread exists. Payload carries ShellNode identity (life-domain, layer, scope). No turn_id."
    abi_value: 1
  - value: turn.started
    label: "Turn started"
    description: "A user turn began. Payload carries the user text after redaction."
    abi_value: 2
  - value: turn.assistant_delta
    label: "Assistant delta"
    description: "Incremental assistant text for the in-flight turn. seq still increases per append."
    abi_value: 3
  - value: turn.cancelled
    label: "Turn cancelled"
    description: "Cancel was accepted for this turn. A later turn.settled records the terminal settle state."
    abi_value: 4
  - value: turn.settled
    label: "Turn settled"
    description: "Turn reached a terminal settle state (completed, failed, or cancelled)."
    abi_value: 5
