_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/enums/acs_turn_states"
  title: "ACS Turn States"
  description: |
    Projection states for an agent turn. Distinct from settle states:
    cancelled-the-command is a transition; settled is the terminal bucket.
  generates:
    - "pydantic:AcsTurnState"
    - "ts:AcsTurnState"
    - "rust:AcsTurnState"
    - "c:LwAcsTurnState"
  depends_on: []

name: acs_turn_states
description: "Projection lifecycle of an agent turn"
default: streaming
closed: true
options:
  - value: streaming
    label: "Streaming"
    description: "Turn is in flight; assistant deltas may still arrive."
    abi_value: 1
  - value: settling
    label: "Settling"
    description: "Cancel or completion is in progress; no further deltas."
    abi_value: 2
  - value: settled
    label: "Settled"
    description: "Terminal. See acs_settle_states for why."
    abi_value: 3
