  title: "Persona RBAC Roles"
  description: |
    Closed catalog of agent_definition.rbac_role values, copied from live
    ~/.lightwave/config/agents/*.yaml. Projection on Identities is the
    same noun. Not tenant_role. Do not invent a role that no persona YAML
    declares.
