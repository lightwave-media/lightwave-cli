_meta:
  version: "0.1.0"
  schema_id: "lightwave://schemas/data/enums/cineos_colour_spaces"
  title: "CineOS Colour Space Enum"
  description: |
    Colour-space vocabulary for cineOS (clip input spaces, deliverable output
    spaces). OPEN (closed: false) — values are the FilmLight factory
    colour-space names enumerated from the live Baselight install so the
    Baselight handshake needs no mapping (ADR-0001 verbatim-key doctrine
    applied to colour). GENERATED FILE — do not hand-edit; regenerate with
    scripts/extract-baselight-colour-spaces.py (2026-08-12, 110 names).
  generates:
    - "go:CineColourSpace"
    - "typescript:CineColourSpace"
    - "zig:CineColourSpace"
    - "json_schema:cineos_colour_spaces"
  depends_on: []

