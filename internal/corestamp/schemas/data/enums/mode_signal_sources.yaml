_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/data/enums/mode_signal_sources"
  title: "Mode Signal Source Enum — why the system believes this mode is active"
  description: |
    The cause of the current operating_mode. Recorded on every mode transition
    so that override is a first-class, auditable event rather than a silent
    correction of the machine.

    tier encodes arbitration precedence, so it lives here rather than in a
    downstream hook's comments:
      Tier 1 — human. Explicit choice always wins and sets a decaying lock.
               No signal overrides a live lock.
      Tier 2 — inference suggests, never seizes. The highest-confidence
               tier-2 signal becomes a dismissible suggestion; it must never
               mutate mode on its own.
      Tier 3 — derived default. Fallback when there is no lock and no signal.
  generates:
    - "typescript:ModeSignalSource"
    - "go:ModeSignalSource"
  depends_on:
    - "lightwave://schemas/data/enums/operating_modes"
name: mode_signal_sources
description: "Cause of a mode transition, ordered by arbitration tier."
default: "derived"
closed: true
options:
  - value: "human"
    label: "Human"
    description: "Explicit operator choice. Tier 1. Always wins. Sets a lock."
    tier: 1
  - value: "calendar"
    label: "Calendar"
    description: "Inferred from an imminent or active calendar event. Tier 2."
    tier: 2
  - value: "mail"
    label: "Mail"
    description: "Inferred from unread volume or an inbound client request. Tier 2."
    tier: 2
  - value: "repo"
    label: "Repository"
    description: "Inferred from a PR awaiting review or a dirty worktree. Tier 2."
    tier: 2
  - value: "clock"
    label: "Clock"
    description: "Inferred from time of day, sprint boundary, or first session. Tier 2."
    tier: 2
  - value: "active_state"
    label: "Active state"
    description: "Read from the local lightwave.db active_state window. Tier 2."
    tier: 2
  - value: "derived"
    label: "Derived default"
    description: "Fallback when no signal and no lock is present. Tier 3."
    tier: 3
