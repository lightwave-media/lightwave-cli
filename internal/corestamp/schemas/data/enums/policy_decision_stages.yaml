_meta:
  version: 1.0.0
  schema_id: lightwave://schemas/data/enums/policy_decision_stages
  title: Policy Decision Stages
  description: |
    Closed enum for policy_decision.stage — the ordered gauntlet a request
    passes through, deny-first. Transcribed verbatim from EPIC-ONTO-001 §13,
    which already ruled this order; this file is the transcription, not a
    re-decision. A deviation is escalated to the epic, never silently adjusted
    here.

    THE ORDER IS THE CONTRACT. Declaration order in `options` IS the evaluation
    order — index 0 runs first, and the first stage to deny ends evaluation.
    Nothing downstream may reorder it, and no stage may be skipped to reach a
    later one. Enforced by tests/validation/test_policy_decision_stage_order.py,
    which pins the exact sequence so a reordering edit fails rather than
    quietly changing what the system permits.

    WHY DENY-FIRST. The cheap, immutable restrictions run before the expensive,
    contextual ones, so a request that can never be allowed is refused before
    any identity is resolved or any model is consulted. The alternative —
    scoring everything and combining at the end — makes a refusal a weighted
    opinion rather than a rule, and gives an agent a surface to argue with.

    FAIL-CLOSED. `closed: true` is load-bearing: a stage value outside this
    vocabulary is not an unknown stage to be passed over, it is a denial. An
    evaluator that receives an unrecognised stage denies, because a gauntlet
    that skips the stage it cannot parse is not a gauntlet.
  closed: true
  generates:
  - pydantic:PolicyDecisionStage
  depends_on: []
name: policy_decision_stages
default: safety
options:
- value: safety
  label: Safety, Privacy and Legal
  description: >
    Immutable safety, privacy and legal restrictions. Runs first and is the one
    stage no context can unlock — not a role, not an approval, not an operator
    instruction. A deny here is terminal.
- value: identity
  label: Identity and Tenant
  description: Who is asking, and on whose tenant. An unresolved identity denies rather than defaulting to anonymous.
- value: role
  label: Role
  description: The role that identity holds. Bound to policy/security/rbac user_type, not re-derived per call.
- value: capability
  label: Capability Intersection
  description: >
    The intersection of what the role may do and what the surface offers. An
    intersection, never a union — a capability the surface exposes but the role
    lacks is absent, not negotiable.
- value: object_permissions
  label: Object and Source Permissions
  description: Permissions on the specific object or source addressed, after the role-level check has already passed.
- value: environment
  label: Environment
  description: Where this runs — prod, staging, local — and what that environment forbids regardless of role.
- value: preconditions
  label: Preconditions
  description: Declared preconditions of the action itself. An unmet precondition denies; it does not warn and proceed.
- value: risk
  label: Risk
  description: Risk and reversibility of the effect. The first stage whose input is an estimate rather than a fact.
- value: approval
  label: Approval
  description: >
    Human authority, where the risk tier requires it. Binds to
    data/meta/auth_gate_event, which takes Touch ID as the authority signal and
    never infers approval from LLM output.
- value: idempotency
  label: Idempotency
  description: Whether this effect has already been applied. A duplicate key returns the original receipt instead of acting twice.
- value: effect
  label: Effect
  description: The effect is applied. The first stage that changes the world rather than judging whether it may be changed.
- value: receipt
  label: Receipt
  description: >
    The receipt is written. A decision that reaches this stage is allowed and
    recorded; evaluation reaching `receipt` is what `verdict: allow` means.
