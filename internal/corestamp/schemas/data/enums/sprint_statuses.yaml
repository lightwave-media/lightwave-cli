_meta:
  version: "2.1.0"
  schema_id: "lightwave://schemas/data/enums/sprint_statuses"
  title: "Sprint Status Enum"
  description: |
    RETIRED 2026-09-23 — superseded by agile_statuses. Every agile artifact
    declares `status_enum: agile_statuses`; one status vocabulary per work
    spine wins. Kept on disk so generated types and __index.yaml still
    resolve. Do not add options here and do not cite it from a new schema.
    v2.1.0 records the retirement; nothing else changed.

    Lifecycle statuses for Sprint entities. Closed enum.

    v2.0: values merged from print back into stamp per revised R-15.
    Originally extracted from legacy products/createos/config.yaml.
  generates:
    - "pydantic:SprintStatus"
  depends_on: []

name: sprint_statuses
description: "Lifecycle statuses for Sprint entities"
default: not_started
closed: true
options:
  - value: not_started
    label: "Not Started"
    description: "Sprint not yet begun"
    is_active: false
  - value: active
    label: "Active"
    description: "Sprint currently in progress"
    is_active: true
  - value: completed
    label: "Completed"
    description: "Sprint finished"
    is_active: false
    is_completed: true
  - value: cancelled
    label: "Cancelled"
    description: "Sprint was cancelled"
    is_active: false
