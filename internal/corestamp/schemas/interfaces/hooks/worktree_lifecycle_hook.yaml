_meta:
  version: "2.1.0"
  schema_id: "lightwave://schemas/interfaces/hooks/worktree_lifecycle_hook"
  title: "Worktree Lifecycle Hook Contract — WorktreeCreate / WorktreeRemove"
  description: |
    Contract for the Claude Code harness worktree hooks (CORE-0047, CORE-0051).
    When a WorktreeCreate hook is registered it takes precedence over native
    git worktree creation for --worktree sessions, --spawn=worktree, and
    Agent(isolation:"worktree") alike — the hook decides WHERE worktrees
    live, so this contract is what pins the canonical root, naming, marker,
    and lock invariants.

    STATUS — this contract is NOT YET MATERIALISED (verified 2026-09-12).
    Neither ~/.claude/hooks/worktree-create.ts nor worktree-remove.ts exists,
    and neither WorktreeCreate nor WorktreeRemove appears in settings.json.
    Earlier versions of this description asserted those prints as present,
    which is the more dangerous direction for a contract to drift: a reader
    concludes placement is enforced and stops checking.

    What actually enforces placement today is ~/.claude/hooks/
    pre-tool-use-worktree.ts, registered on PreToolUse:Bash. It intercepts the
    `git worktree add` VERB and rejects destinations outside the canonical root
    — so a worktree an agent creates by running git is gated, and everything
    below is not:

      - native harness creation (--worktree sessions, --spawn=worktree,
        Agent(isolation:"worktree")) never runs a Bash command, so no
        PreToolUse hook sees it;
      - `lw workspace prepare` / `release` are therefore not delegated to by
        any registered surface, so the broker adapter described below is a
        design, not a running component.

    Registering the two events is an operator action (an agent may not register
    a permission-decision hook), which is why this sits unmaterialised rather
    than half-built.

    v2.1.0 (2026-09-12): STATUS block above added — the contract described two
    prints that do not exist and two events that are not registered, so it
    asserted an enforcement surface nobody had built (lightwave-core#571). The
    field contract below is unchanged; only the claim about what is running is.
    v2.0.0 (CORE-0051): the hook is the Claude Code adapter of the workspace
    broker. It delegates allocation to `lw workspace prepare` and returns the
    brokered path (~/.worktrees/<repo>/<slug>) as hookSpecificOutput.worktree_path;
    WorktreeRemove delegates to `lw workspace release`. Any non-zero exit
    aborts the harness operation (verified against code.claude.com/docs/en/hooks
    2026-09-02), which is what makes fail_closed real. When the hook is NOT
    registered, Claude creates natively under .claude/worktrees; that tree is
    a vendor-managed workspace and must be registered before its first write.

    Companion to git_doctor.yaml (fleet validation) and the policy pair
    worktree_policy.yaml + worktree_home_policy.yaml. Per lightwave-core#357:
    hook-enforced invariants belong in the stamp — a print-only contract
    lets the hook drift from policy with no schema gate to catch it.
  generates:
    - "json_schema:worktree_lifecycle_hook"
  depends_on:
    - "lightwave://schemas/policy/security/worktree_policy"
    - "lightwave://schemas/data/meta/worktree_home_policy"
    - "lightwave://schemas/policy/security/workspace_broker_policy"

required_fields:
  - name: hook_event
    type: str
    description: "Enum: WorktreeCreate | WorktreeRemove"
  - name: worktree_root
    type: str
    description: "Canonical root the brokered path lives under. Locked: ~/.worktrees/{repo}/ per worktree_home_policy.canonical_root + path_layout (CORE-0051)."
  - name: naming_regex
    type: str
    description: "Directory-name regex the created worktree must match. Locked: ^[a-z0-9][a-z0-9-]*$ — the task slug per worktree_policy.repo_structure.naming."
  - name: marker_file
    type: str
    description: "Claim marker written at creation. Locked: .lw-worktree.yaml per worktree_policy.repo_structure.claim."
  - name: lock_on_create
    type: bool
    description: "When true, `git worktree lock` runs at creation so ambient prune/cleanup cannot remove a claimed tree."
  - name: save_gate
    type: str
    description: "Enum: wip_branch_commit | refuse_dirty. WorktreeRemove behavior for a dirty tree — wip_branch_commit stages TRACKED files only (git add -u, never -A) and commits to wip/<name> before removal."

optional_fields:
  - name: observability_channel
    type: str
    description: "JSONL channel receiving one event per create/remove (default ~/.lightwave/observability/worktree_maintenance.jsonl)."
  - name: fallback_on_error
    type: str
    description: "Enum: fail_closed | native. Locked to fail_closed: a hook error must surface as a creation failure, never fall through to an unstamped root."
  - name: broker_verb
    type: str
    description: "Which `lw workspace` verb the hook delegates to: prepare for WorktreeCreate, release for WorktreeRemove (workspace_broker_policy.broker_verbs)."

example:
  hook_event: WorktreeCreate
  worktree_root: "~/.worktrees/{repo}/"
  naming_regex: "^[a-z0-9][a-z0-9-]*$"
  marker_file: ".lw-worktree.yaml"
  lock_on_create: true
  save_gate: wip_branch_commit
  observability_channel: "~/.lightwave/observability/worktree_maintenance.jsonl"
  fallback_on_error: fail_closed
  broker_verb: prepare
