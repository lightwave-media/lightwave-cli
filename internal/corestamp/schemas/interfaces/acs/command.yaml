_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/interfaces/acs/command"
  title: "ACS Command"
  description: |
    Envelope for an Agent Control Surface command. createOS (and later lw)
    submit this shape; libLightwave is the only writer of the resulting
    events. The print is the LightWave homedir SQLite at
    ~/.lightwave/index/lightwave.db (homedir.yaml index/). There is no
    createOS-owned agent.db and no dual-write. Engine choice (SQLite vs
    Postgres) follows ADR-0002 / CORE-0049; the path stays inside the
    LightWave print, never an app-local database.

    Kind-specific fields are optional at the envelope layer and required
    by the matching command kind:
      agent_thread_create  — life_domain, shell_node_id, layer, scope
      agent_turn_start     — thread_id, text, idempotency_key
      agent_turn_cancel    — thread_id, turn_id
      agent_subscribe_thread — thread_id, from_seq (subscribe does not write)
  generates:
    - "ts:AcsCommand"
    - "rust:AcsCommand"
    - "c:LwAcsCommand"
    - "go:AcsCommand"
  depends_on:
    - "lightwave://schemas/data/enums/acs_command_kinds"
    - "lightwave://schemas/data/enums/domains"

required_fields:
  - name: kind
    type: enum
    values_ref: "lightwave://schemas/data/enums/acs_command_kinds"
    description: "Which ACS command this envelope is."
  - name: idempotency_key
    type: str
    description: "Caller-supplied idempotency key. Required on mutating commands; ignored on agent_subscribe_thread. Duplicate keys return the original receipt."

optional_fields:
  - name: thread_id
    type: str
    description: "Existing thread. Required for start, cancel, and subscribe. Absent on create."
  - name: turn_id
    type: str
    description: "Existing turn. Required for cancel."
  - name: text
    type: str
    description: "User text for agent_turn_start. Redacted before durable append."
  - name: from_seq
    type: int
    description: "Inclusive replay cursor for agent_subscribe_thread."
  - name: life_domain
    type: enum
    values_ref: "lightwave://schemas/data/enums/domains"
    description: "Life Domain of the ShellNode. This is the domain identifier — do not invent a second one."
  - name: shell_node_id
    type: str
    description: "Stable ShellNode id the new thread is bound to (create only)."
  - name: layer
    type: str
    description: "ShellNode layer. Carried from the existing ShellNode model; not a second domain."
  - name: scope
    type: str
    description: "ShellNode scope. Carried from the existing ShellNode model; not a second domain."

example:
  kind: agent_turn_start
  idempotency_key: "example-idempotency-key-1"
  thread_id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
  text: "Summarise today's standup."
