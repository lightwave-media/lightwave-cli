_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/interfaces/acs/event"
  title: "ACS Event"
  description: |
    One durable row in the agent_event log. libLightwave assigns per-thread
    seq atomically with the append. Rows live in the LightWave print at
    ~/.lightwave/index/lightwave.db (logical table agent_event). createOS
    must not open a parallel agent.db. Payload encoding on the C ABI is
    UTF-8 JSON, maximum 1 MiB.

    Kind-specific payload:
      thread.created         — life_domain, shell_node_id, layer, scope
      turn.started           — text (redacted)
      turn.assistant_delta   — text
      turn.cancelled         — empty object
      turn.settled           — settle (acs_settle_states)
  generates:
    - "ts:AcsEvent"
    - "rust:AcsEvent"
    - "c:LwAcsEvent"
    - "go:AcsEvent"
  depends_on:
    - "lightwave://schemas/data/enums/acs_event_kinds"
    - "lightwave://schemas/data/enums/acs_settle_states"
    - "lightwave://schemas/data/enums/domains"
  table_kind: event
  table_name: agent_event

required_fields:
  - name: seq
    type: int
    description: "Per-thread monotonic sequence assigned at append. Starts at 1."
  - name: thread_id
    type: str
    description: "Thread this event belongs to."
  - name: kind
    type: enum
    values_ref: "lightwave://schemas/data/enums/acs_event_kinds"
    description: "Event kind. Closed vocabulary."
  - name: occurred_at
    type: datetime
    description: "ISO 8601 UTC timestamp of the append."
  - name: life_domain
    type: enum
    values_ref: "lightwave://schemas/data/enums/domains"
    description: "Life Domain copied from the thread's ShellNode. Not a second domain identifier."

optional_fields:
  - name: turn_id
    type: str
    description: "Turn this event belongs to. Absent on thread.created."
  - name: shell_node_id
    type: str
    description: "ShellNode id. Required on thread.created; optional elsewhere."
  - name: layer
    type: str
    description: "ShellNode layer. Required on thread.created."
  - name: scope
    type: str
    description: "ShellNode scope. Required on thread.created."
  - name: text
    type: str
    description: "Redacted user text (turn.started) or assistant delta text (turn.assistant_delta)."
  - name: settle
    type: enum
    values_ref: "lightwave://schemas/data/enums/acs_settle_states"
    description: "Terminal reason. Required on turn.settled; absent otherwise."

example:
  seq: 1
  thread_id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
  kind: thread.created
  occurred_at: "2026-09-02T20:00:00Z"
  life_domain: software-development
  shell_node_id: "shell-node-createos"
  layer: product
  scope: createos
