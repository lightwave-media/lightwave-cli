_meta:
  version: "1.0.0"
  schema_id: "lightwave://schemas/interfaces/acs/abi"
  title: "libLightwave C ABI v1"
  description: |
    Walking-skeleton C ABI for libLightwave (API-ACS-0001). Proves resolve,
    open, append one opaque UTF-8 JSON event, read by sequence, and close.
    Zig implements this stamp in lightwave-sys; this file is the shape the
    generated header must match. Symbol prefix lw_. Static link only on
    macOS and Linux for v1. Maximum event payload 1 MiB.
  generates:
    - "c:lightwave.h"
    - "rust:liblightwave_sys"
  depends_on:
    - "lightwave://schemas/data/enums/lw_statuses"

required_fields:
  - name: abi_major
    type: int
    description: "ABI major. Encoded in lw_abi_version as major << 16 | minor."
  - name: abi_minor
    type: int
    description: "ABI minor. Additive changes only within a major."
  - name: symbol_prefix
    type: str
    description: "Public symbol prefix. Locked to lw_."
  - name: max_payload_bytes
    type: int
    description: "Maximum UTF-8 JSON event payload accepted by lw_store_append."
  - name: link_mode
    type: str
    description: "v1 link mode. Locked to static."

functions:
  - name: lw_abi_version
    returns: uint32_t
    description: "Returns major << 16 | minor from this stamp."
    params: []
  - name: lw_root_resolve
    returns: LwStatus
    description: "Write the canonical LightWave root path as UTF-8 into out_path. Size-query when ptr is NULL and cap is 0."
    params:
      - name: out_path
        type: LwBuffer*
  - name: lw_store_open
    returns: LwStatus
    description: "Open the event store at the caller-supplied path. A second writer returns LW_BUSY."
    params:
      - name: path
        type: LwString
      - name: options
        type: const LwStoreOptions*
      - name: out_store
        type: LwStore*
  - name: lw_store_close
    returns: LwStatus
    description: "Close takes a pointer to the handle, nulls it, and succeeds for NULL."
    params:
      - name: store
        type: LwStore*
  - name: lw_store_append
    returns: LwStatus
    description: "Append one UTF-8 JSON event. Assigns out_seq. Rejects payloads over max_payload_bytes."
    params:
      - name: store
        type: LwStore
      - name: event_json
        type: LwString
      - name: out_seq
        type: uint64_t*
  - name: lw_store_read
    returns: LwStatus
    description: "Read the event JSON at seq into out_event_json. Size-query supported."
    params:
      - name: store
        type: LwStore
      - name: seq
        type: uint64_t
      - name: out_event_json
        type: LwBuffer*

example:
  abi_major: 1
  abi_minor: 0
  symbol_prefix: lw_
  max_payload_bytes: 1048576
  link_mode: static
