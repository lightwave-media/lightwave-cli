_meta:
  version: 1.0.0
  schema_id: lightwave://schemas/interfaces/a2a/event
  title: A2A Event — Agent-to-Agent Message Protocol
  description: 'The canonical event shape for agent-to-agent communication in the

    Lightwave Harness. Every agent dispatch, CI signal, review gate, and

    ponytail audit is an A2A event. Events are routed by signal type to

    the appropriate agent persona via the nullhub dispatch API.


    This is the protocol that ci-signal.sh, the CI feedback loop, the

    ponytail audit, and the sprint orchestration all speak. One event

    shape, many consumers.

    '
  generates:
  - go:A2AEvent
  depends_on:
  - lightwave://schemas/data/meta/agent_identity
  - lightwave://schemas/data/enums/lifecycle_phases
required_fields:
- name: event_id
  type: str
  description: UUID v4, generated by the sender
- name: event_type
  type: enum
  options:
  - ci.gate.failed
  - ci.gate.passed
  - ponytail.audit
  - sprint.review
  - phase.transition
  - agent.dispatch
  - agent.response
  - cron.tick
  description: Type of A2A event emitted (e.g. task_started, result).
- name: timestamp
  type: str
  description: ISO 8601 UTC
- name: sender
  type: str
  description: Agent instance name (e.g. v_core-package-developer) or 'system'
- name: recipient
  type: str
  description: Agent instance name or persona role
optional_fields:
- name: signal
  type: str
  description: Failure signal classification (lsp_diagnostic, test_failure, lint, etc.)
- name: gate
  type: str
  description: CI gate name
- name: repo
  type: str
  description: Repository where the A2A event originated.
- name: branch
  type: str
  description: Branch associated with the A2A event.
- name: commit
  type: str
  description: Commit SHA associated with the A2A event.
- name: payload
  type: dict
  description: Arbitrary event-specific data
- name: correlation_id
  type: str
  description: Links request/response events in a conversation
- name: skill
  type: str
  description: Skill to activate on receipt (e.g. ponytail-audit)
routing:
  description: 'Signals are routed to agent personas based on the event_type and signal

    classification. The dispatch table is defined here so ci-signal.sh and

    the nullhub cron dispatcher both read from the same source.

    '
  table:
    ci.gate.failed:
      recipient: v_core-package-developer
      action: Fix CI failure, commit, report
    ci.gate.passed:
      recipient: v_staff-engineer
      action: Run ponytail audit on the diff
      skill: ponytail-audit
    ponytail.audit:
      recipient: v_staff-engineer
      action: Adversarial architecture review
      skill: ponytail-audit
    sprint.review:
      recipient: v_cto
      action: Release-train sign-off
    phase.transition:
      recipient: v_scrum-manager
      action: Orchestrate phase change
    agent.dispatch:
      recipient: determined by signal field
      action: Process and respond
delivery:
  description: 'Events are delivered through nullhub''s dispatch API. The sender POSTs

    to the recipient''s agent endpoint. The recipient processes the event

    and may respond with an agent.response event.

    '
  primary:
    method: POST
    endpoint: /api/instances/nullclaw/{recipient}/agent
    body: '{"message": "<human-readable summary>", "event": "<json-encoded A2A event>"}'
  span_ingestion:
    method: POST
    endpoint: /api/nullwatch/v1/spans
    body: '{"name": "<event_type>", "attributes": {"event": "<json-encoded A2A event>"}}'
  discussion:
    method: POST
    endpoint: /api/v1/repos/{owner}/{repo}/issues
    forgejo: true
example:
  event_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  event_type: ci.gate.failed
  timestamp: '2026-06-23T19:56:36Z'
  sender: system
  recipient: v_core-package-developer
  signal: lint
  gate: lint
  repo: lightwave-core
  branch: main
  commit: 2cb2553
  payload:
    failures:
    - task: lint
      message: ERROR task failed
      severity: error
