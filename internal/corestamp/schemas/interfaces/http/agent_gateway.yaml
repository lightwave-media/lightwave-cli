_meta:
  version: "0.1.0"
  schema_id: "lightwave://schemas/interfaces/http/agent_gateway"
  title: "Agent Gateway — Four-Question Wire Contract"
  description: |
    The policy-as-code gate every agent call passes through BEFORE it reaches
    an LLM, a tool, or a null* endpoint — enforced OUTSIDE the LLM loop.

    This stamp is DESCRIPTIVE of what lightwave-ai's `src/agentgateway/`
    already implements (Phase 0a: lightwave-ai#19 four-question gate + keyed
    client, lightwave-ai#24 live reverse proxy). It is written so the wire
    contract lives in the stamp rather than in a Zig doc comment, which is the
    inversion lightwave-core#650 was filed to correct. It does NOT propose new
    behaviour; where Phase 0a is a prototype, this records that fact rather
    than specifying the finished form.

    Per the IMDA agentic-AI governance framework and Amazon Bedrock AgentCore,
    which converged on the same four pre-action questions, each call is
    evaluated in this fixed order and short-circuits on the first denial:

      1. identity       — who is the agent?        (credential verified)
      2. authorization  — allowed on this surface? (rbac role -> surfaces)
      3. allowed_action — action in its capabilities?
      4. auditability   — record every decision, ALLOW AND DENY

    Auditability is not a fourth gate but an unconditional obligation: the
    evaluator records an audit entry before returning any verdict, so a denial
    is as observable as a grant.

    The normative enumerations below (surfaces, credential_kinds, stages,
    headers, outcomes, invariants) are the contract itself, not illustrations,
    so they are declared at the top level rather than inside `example` — per
    R-44, `example` carries one representative call, not the catalog.

  generates:
    - "go:AgentGateway"
    - "json_schema:agent_gateway"
  depends_on:
    - "lightwave://schemas/data/meta/agent_identity"
    - "lightwave://schemas/data/meta/audit_event"

required_fields:
  - name: surfaces
    type: "list[str]"
    description: "Call surfaces the gate distinguishes."

  - name: credential_kinds
    type: "list[CredentialKind]"
    description: "The credential union an agent may present. Exactly one per request."

  - name: stages
    type: "list[str]"
    description: >
      Verdict stages recorded on every decision. The first three appear only
      on denials; `allowed` is the sole grant.

  - name: headers
    type: "list[HeaderDef]"
    description: "Request header grammar for the inbound (HTTP) surface."

  - name: outcomes
    type: "list[OutcomeDef]"
    description: "The three terminal outcomes of an inbound request."

  - name: invariants
    type: "list[InvariantDef]"
    description: >
      Properties Phase 0a enforces that a reimplementation could silently
      lose. Each is load-bearing for the gate's security claim.

sub_schemas:
  CredentialKind:
    name: str            # signature | token | capability
    verified: bool       # false = presence checked, authenticity NOT verified
    description: str
    note: str

  HeaderDef:
    name: str
    required: bool
    credential: bool     # true if presenting this header selects a credential
    description: str

  OutcomeDef:
    name: str            # proxy | denied | not_fronted
    http_status: str
    description: str

  InvariantDef:
    id: str
    rule: str

  AgentRecord:
    id: str
    public_key: str      # Ed25519, 32 bytes
    token: str
    rbac_role: str
    surfaces: "list[str]"
    capabilities: "list[str]"

  AuditEntry:
    agent_id: str
    surface: str
    action: str
    allow: bool
    stage: str
    reason: str

# =============================================================================
# NORMATIVE CONTRACT — the values themselves, not an example of them
# =============================================================================

surfaces: [tool, a2a, inbound]

stages: [identity, authorization, allowed_action, allowed]

credential_kinds:
  - name: signature
    verified: true
    description: >
      Ed25519 signature over the request payload, checked against the agent's
      registered public key.
    note: "Provable and non-repudiable — the intended credential for a2a and voice."
  - name: token
    verified: true
    description: >
      Bearer token. Compared by SHA-256 digest under a constant-time equality
      check; an empty expected token always fails.
    note: >
      Whether this is per-agent or shared is UNRESOLVED and contradicts
      agent_identity.yaml. See open_questions.credential-ownership.
  - name: capability
    verified: false
    description: "Scoped short-lived token. Phase 0a checks PRESENCE ONLY."
    note: >
      PROTOTYPE. Issuance, expiry and scope are not verified.
      Tracked: lightwave-ai#21.

headers:
  - name: X-LW-Agent-Id
    required: true
    credential: false
    description: "The calling agent's registry id. Absent or unknown denies at identity."
  - name: Authorization
    required: false
    credential: true
    description: "`Bearer <token>` — selects the token credential."
  - name: X-LW-Capability
    required: false
    credential: true
    description: "Selects the capability credential (presence-only in Phase 0a)."
  - name: X-LW-Signature
    required: false
    credential: true
    description: "base64 Ed25519 signature over the request body — selects the signature credential."

outcomes:
  - name: proxy
    http_status: "upstream status, relayed"
    description: >
      Gate passed. Method, path, body and content-type are forwarded to the
      null* upstream and its response relayed back.
  - name: denied
    http_status: "403"
    description: >
      The four-question gate refused. The decision was already audited with
      its stage and reason.
  - name: not_fronted
    http_status: "404"
    description: >
      Path absent from the module route catalog. Never proxied — an unknown
      path cannot become an open relay.

invariants:
  - id: single-credential
    rule: >
      Exactly one credential header may be present. Two is a 400 — the gate
      must not let client-controlled header order pick which credential it
      verifies.
  - id: no-empty-credential
    rule: >
      No credential header may carry an empty token; an empty value denies at
      identity rather than proxying unauthenticated.
  - id: path-is-the-action
    rule: >
      On the inbound surface the RESOLVED ENDPOINT PATH is the action passed
      to allowed_action, so an agent's capabilities enumerate exactly which
      null* endpoints it may call.
  - id: catalog-gated
    rule: >
      Only paths present in the module route catalog are proxied. NFR-1's
      intent is that no null* endpoint is reachable except through the gate.
  - id: audit-both-verdicts
    rule: >
      Every evaluation records an AuditEntry before returning, for grants as
      well as denials.
  - id: constant-time-token
    rule: >
      Token comparison hashes both sides and compares in constant time, so
      match latency cannot leak token content.

# =============================================================================
# Representative shape of each declared field. Per R-44 this is an
# ILLUSTRATION, not the catalog — the complete normative population is
# declared at the top level above.
# =============================================================================
example:
  surfaces: [tool, a2a, inbound]

  stages: [identity, authorization, allowed_action, allowed]

  credential_kinds:
    - name: signature
      verified: true
      description: "Ed25519 signature over the request payload."
      note: "Provable and non-repudiable."
    - name: capability
      verified: false
      description: "Scoped short-lived token; presence checked only."
      note: "PROTOTYPE — tracked lightwave-ai#21."

  headers:
    - name: X-LW-Agent-Id
      required: true
      credential: false
      description: "The calling agent's registry id."
    - name: Authorization
      required: false
      credential: true
      description: "`Bearer <token>` — selects the token credential."

  outcomes:
    - name: proxy
      http_status: "upstream status, relayed"
      description: "Gate passed; forwarded to the null* upstream."
    - name: denied
      http_status: "403"
      description: "The gate refused; the decision was already audited."

  invariants:
    - id: single-credential
      rule: "Exactly one credential header may be present; two is a 400."
    - id: audit-both-verdicts
      rule: "Every evaluation records an AuditEntry, for grants as well as denials."

# =============================================================================
# RESOLVED — the two decisions #650 was opened to settle
# =============================================================================

credential_model:
  # Decision: provider API keys and gateway credentials are DIFFERENT THINGS.
  # agent_identity.yaml's "provider API keys are shared resources (not
  # per-agent)" is true and unchanged — it governs OpenRouter/Anthropic keys,
  # which are shared infrastructure billed to the org. A GATEWAY credential
  # answers a different question ("which agent is calling?"), so it is
  # necessarily per-agent: an identity check against a shared secret proves
  # nothing. The two statements never actually conflicted; they were about
  # different secrets with no stamp saying so.
  provider_keys:
    scope: shared
    purpose: "Model inference billing. Governed by agent_identity.yaml."
    example: "/lightwave/prod/OPENROUTER_API_KEY"
  gateway_credentials:
    scope: per-agent
    purpose: "Answer question 1 (identity) — which agent is calling."
    provisioned: false
    note: >
      NOT PROVISIONED. Verified 2026-09-12 against the live account: SSM holds
      35 parameters under /lightwave/prod/ and ZERO under
      /lightwave/prod/agents/. gateway.zig's doc comment cites
      `ssm:/lightwave/prod/agents/<name>/api_key`, a path that has never
      existed. The gateway therefore cannot authenticate anyone today — this,
      not the credential model, is the real reason there is no entrypoint.
      Provisioning is tracked at lightwave-ai#98.

registry_source:
  # Decision: the Registry derives from agent_definition — the persona YAMLs
  # at ~/.lightwave/config/agents/v_*.yaml. That print already exists (41
  # personas), is stamped by data/meta/agent_definition, and is validated by
  # R-59. Inventing a parallel agent list would be the §7 violation this
  # schema was written to end.
  schema: "lightwave://schemas/data/meta/agent_definition"
  print: "~/.lightwave/config/agents/v_*.yaml"
  field_mapping:
    - gateway_field: id
      source: "persona `name`"
      status: present
    - gateway_field: rbac_role
      source: "persona `rbac_role`"
      status: present
    - gateway_field: surfaces
      source: "derived from rbac_role"
      status: absent
    - gateway_field: capabilities
      source: "endpoint paths the role may call"
      status: absent
    - gateway_field: public_key
      source: "per-agent Ed25519, provisioned"
      status: absent
    - gateway_field: token
      source: "per-agent bearer, provisioned"
      status: absent
  note: >
    Four of the six Agent fields are not yet carried by agent_definition.
    They are ADDITIVE to that schema — a new optional `gateway` block on the
    persona — not a new print. Extending it is tracked at lightwave-ai#98
    alongside provisioning, because a field with no value to hold is not worth
    stamping first.

# =============================================================================
# Known gaps — Phase 0a is a prototype in these specific places
# =============================================================================
open_questions:
  - id: capability-verification
    question: >
      Capability tokens are presence-only. Authenticity (issued, unexpired,
      in-scope) is unverified.
    tracked: "lightwave-ai#21"
  - id: catalog-coverage
    question: >
      The route catalog embeds nullhub only. nulltickets and nullwatch expose
      no /api/meta/routes, so they are UNVERIFIED in the NFR-1 denominator.
    tracked: "lightwave-ai#20, lightwave-ai#58"
