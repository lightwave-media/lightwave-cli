name: Base Test

on:
  workflow_call:
    inputs:
      os:
        description: "Runner OS (ubuntu-latest, macos-latest, …)"
        required: false
        type: string
        default: ubuntu-latest
      upload-junit:
        description: "Upload JUnit XML report via mikepenz/action-junit-report"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Tests (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup tooling via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go (fallback for module cache)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with JUnit output
        # Pipe through go-junit-report (installed via .mise.toml) so the
        # JUnit XML renders in the GitHub Actions summary. `set -o pipefail`
        # preserves the test-failure exit code through the pipe.
        #
        # -race catches data races on process-global state (os.Stdout swap,
        # env mutation) that t.Parallel hides on macOS but exposes on Linux
        # — see PR #57 testutil regression. -shuffle=on surfaces
        # order-dependent assumptions even without -race.
        run: |
          set -o pipefail
          go test -race -shuffle=on -v ./... 2>&1 | tee test-output.txt | mise exec -- go-junit-report -set-exit-code > test-results.xml

      # Everything below runs only on failure, and exists because a failing run
      # here used to say nothing but "internal/agent | Failed 0.35s" (#345).
      # The step above pipes `go test -v` straight into the JUnit converter, so
      # the job log holds the XML and not one line of test output; the reporter
      # then groups by suite, which collapses the test name too. The output was
      # already being written to test-output.txt and simply thrown away.
      #
      # A re-run passes and erases the only evidence, so this has to land in the
      # log, not just an artifact — the artifact needs a deliberate download and
      # expires, and by then the question is usually "was that mine or a flake".
      - name: Show what failed
        if: failure()
        run: |
          bash scripts/failure-digest.sh test-output.txt 2>&1 | tee digest.txt
          {
            echo '### Test failures'
            echo '```'
            cat digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw test output
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-output-${{ inputs.os }}
          path: test-output.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit report
        if: ${{ always() && inputs.upload-junit }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: test-results.xml
          detailed_summary: 'true'
          include_time_in_summary: 'true'
          group_suite: 'true'
          check_name: "Tests / ${{ inputs.os }}"
