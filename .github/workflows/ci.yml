name: CI

# Orchestrator. Every individual job lives in its own reusable
# workflow under .github/workflows/ — this file just wires them up
# with the right matrix and the required-gate aggregation.
#
# Releases (.github/workflows/release.yml) call the same reusable
# workflows to keep `main` ↔ release semantics identical.
#
# CI Required Gate fails on skipped as well as failure/cancelled.
# A skipped lint makes base-test and build skip (`needs: [lint]`); treating
# skipped as green was a green gate with zero tests and zero builds
# (lightwave-cli#350).
#
# Negative control: workflow_dispatch with force_lint_skip=true skips
# lint; the gate job must go red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_lint_skip:
        description: "Negative control — skip lint so CI Required Gate must go red"
        type: boolean
        default: false

concurrency:
  # Cancel in-progress runs for the same PR/SHA; never cancel on main.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write

jobs:
  pre-commit:
    name: Pre-commit
    uses: ./.github/workflows/pre-commit.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  tidy-check:
    name: Tidy Check
    uses: ./.github/workflows/go-mod-tidy-check.yml
    secrets: inherit

  # Schema-drift gate — ARMED 2026-08-27 (#301).
  #
  # Fails the build when commands.yaml and the registered Go handlers
  # disagree in either direction. It sat commented out from 2026-05-22,
  # waiting on a LIGHTWAVE_CORE_TOKEN that was never needed: the
  # lightwave-tap-publisher App (TAP_APP_* secrets, already used by
  # release.yml) can read the private lightwave-core, so the reusable
  # workflow mints an installation token itself.
  #
  # Known blind spot (#337): the gate counts the handler REGISTRY, so
  # commands wired through the legacy cobra tree are invisible to it. That
  # is masked today because every such command lives in a domain marked
  # `_status: in_development`, which the check excludes. It stops being
  # masked the moment one of those domains goes active — see #337 before
  # flipping one.
  schema-drift:
    name: Schema Drift
    uses: ./.github/workflows/schema-drift-check.yml
    secrets: inherit

  lint:
    name: Lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.force_lint_skip != true }}
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    with:
      os: ubuntu-latest

  base-test:
    name: Tests
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/base-test.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}

  build:
    name: Build
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux,   goarch: amd64 }
          - { os: ubuntu-latest, goos: linux,   goarch: arm64 }
          - { os: ubuntu-latest, goos: darwin,  goarch: amd64 }
          - { os: ubuntu-latest, goos: darwin,  goarch: arm64 }
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      goos: ${{ matrix.goos }}
      goarch: ${{ matrix.goarch }}

  gate:
    name: CI Required Gate
    if: always()
    needs:
      [pre-commit, codespell, tidy-check, lint, base-test, build, schema-drift]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [[ "$HAS_FAILURE" == "true" ]]; then
            echo "::error::One or more upstream jobs failed, were cancelled, or were skipped"
            exit 1
          fi
