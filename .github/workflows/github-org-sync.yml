# Org-wide GitHub bootstrap + Lightwave Swarm board hygiene.
#
# Cross-repo private checkout + org Projects/labels cannot use the default
# GITHUB_TOKEN (repo-scoped). Mint a short-lived installation token from the
# lightwave-org-sync GitHub App — same pattern as TAP_APP_* in release.yml.
#
# One-time setup: docs/org-sync-app.md
# Until ORG_SYNC_APP_ID + ORG_SYNC_APP_PRIVATE_KEY exist, leave this workflow
# disabled (Actions → Workflows → github-org-sync → Disable) or only use
# workflow_dispatch after provisioning.
name: github-org-sync

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repo name slice (e.g. lightwave-ai) or empty for full org"
        required: false
        default: ""
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint org-sync token
        id: org-sync
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.ORG_SYNC_APP_ID }}
          private-key: ${{ secrets.ORG_SYNC_APP_PRIVATE_KEY }}
          owner: lightwave-media
          # All repos the bootstrap script labels / reconciles.
          repositories: lightwave-core,lightwave-cli,lightwave-ui,lightwave-platform,lightwave-sys,lightwave-ai,lightwave-infrastructure-catalog,lightwave-infrastructure-live,createOS,nullclaw,nullhub,nullbuilder,nulltickets,nullwatch,nullboiler,joelschaeffer-site,homebrew-tap

      - name: Checkout infrastructure catalog
        uses: actions/checkout@v4
        with:
          repository: lightwave-media/lightwave-infrastructure-catalog
          path: lightwave-infrastructure-catalog
          token: ${{ steps.org-sync.outputs.token }}

      - name: Checkout lightwave-cli
        uses: actions/checkout@v4
        with:
          repository: lightwave-media/lightwave-cli
          path: lightwave-cli
          ref: main
          token: ${{ steps.org-sync.outputs.token }}

      - name: Bootstrap org GitHub assets
        env:
          GH_TOKEN: ${{ steps.org-sync.outputs.token }}
          ORG_LOGIN: lightwave-media
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
        run: |
          bash lightwave-infrastructure-catalog/scripts/bootstrap-github-org.sh

      - name: Build lw and reconcile project board
        env:
          GH_TOKEN: ${{ steps.org-sync.outputs.token }}
        run: |
          cd lightwave-cli
          go build -o /tmp/lw ./cmd/lw
          ARGS=(scrum sync --json)
          if [[ -n "${{ github.event.inputs.target_repo }}" ]]; then
            ARGS+=(--repo "${{ github.event.inputs.target_repo }}")
          fi
          /tmp/lw "${ARGS[@]}"
