# Release — lightwave-cli
# Thin caller for the org release plane (policy/governance/release_pipeline.yaml
# in lightwave-core). The tag IS the version. Everything after the trigger
# happens in the plane; anything added to this file beyond the caller is drift
# against the contract.
#
# Release: git tag vX.Y.Z && git push origin vX.Y.Z
# (or `lw release tag` once #315 ships it)
#
# The plane's go-binary type runs GoReleaser against this repo's
# .goreleaser.yaml (release.mode keep-existing — release-core creates the
# Release with git-cliff notes, GoReleaser attaches artifacts), mints the
# homebrew-tap push token from the TAP_APP_* secrets, and uploads darwin
# binaries for sign-macos.yml (dormant until the MACOS_* secrets are
# provisioned — see docs/release-notarization.md).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the full pipeline for the current ref but skip publish"
        type: boolean
        default: true

# One release at a time; never cancel a publish mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # Pinned by SHA — determinism requires the same tag re-run the same
    # pipeline bytes. Bump SHA + comment together when adopting a new plane
    # release.
    uses: lightwave-media/pipelines-workflows/.github/workflows/release-go-binary.yml@0e10d20b6964383fc5507d9d0d3ea6f778e9939a # v1.2.2
    permissions:
      contents: write
      # shipped-in notifications (feedback_loop, release_pipeline.yaml):
      # the plane comments "shipped in <tag>" on the release range's PRs.
      issues: write
      pull-requests: write
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets: inherit
