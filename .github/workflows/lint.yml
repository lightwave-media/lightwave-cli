name: Lint

on:
  workflow_call:
    inputs:
      os:
        description: "Runner OS (ubuntu-latest, macos-latest, …)"
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so `git merge-base origin/main HEAD` resolves on
          # the runner — without this golangci-lint falls back to "show
          # all issues" mode and the baseline floods the run.
          fetch-depth: 0

      - name: Setup tooling via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Tool versions live in .mise.toml — golangci-lint, goreleaser,
          # go-junit-report, go itself.
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go (fallback for module cache)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in step with the mise.toml pin. This action does not read
          # mise, so the version lives in two places; when you bump one, bump
          # the other. Bumped 2.5.0 -> 2.13.2 with the Go 1.26 move: 2.5.0 is
          # built with go1.25 and panics outright on 1.26 sources
          # ("package requires newer Go version"), so the lint job fails
          # before it evaluates a single rule. 2.13.2 is still v2, so
          # .golangci.yml needs no migration.
          version: v2.13.2
          # Ratchet only — existing violations are tombstoned in
          # internal/audits/golangci-baseline.json. Regressions in touched
          # files re-surface via --new-from-merge-base.
          args: --new-from-merge-base=origin/main --timeout=10m
